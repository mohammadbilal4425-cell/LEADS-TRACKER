<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deal Desk — Denzen</title>
<!--
=====================================================================
 DEAL DESK  —  rate approval + lead closing desk
 ---------------------------------------------------------------
 SETUP (1 minute):
 1. Neeche FB_CONFIG mein apne Firebase project ka config paste karein
    (Sales Tracker wala hi project chalega — data 'dealDesk/' node mein
    alag rehta hai, purana data touch nahi hota).
 2. File GitHub par upload karein -> Pages se link chalayen.
 3. Config khali chhoda to app DEMO MODE mein chalti hai (sample data,
    refresh par reset). Demo mein bhi poora flow test kar sakte hain.
=====================================================================
-->
<style>
:root{
  /* --- palette: dispatch desk --- */
  --ink:#0E1420; --panel:#161E2C; --panel-2:#1C2637; --line:#26324A;
  --txt:#E7ECF5; --mut:#8B99B3; --dim:#63728C;
  --gold:#FFB020; --gold-dim:#5A4415;
  --red:#FF4757; --red-dim:#4A1620;
  --grn:#16C784; --grn-dim:#0E3A2A;
  --blu:#3D7EFF; --blu-dim:#152744;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --r:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--ink);color:var(--txt);font-family:var(--ui);font-size:15px;line-height:1.45;
  padding-bottom:88px;overscroll-behavior-y:none}
input,select,textarea,button{font-family:inherit;font-size:15px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.hide{display:none!important}

/* ---------- shell ---------- */
.top{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,#0E1420 70%,rgba(14,20,32,.85));
  border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:10px}
.brand{font-weight:800;letter-spacing:-.4px;font-size:17px}
.brand small{display:block;font-weight:500;font-size:10.5px;letter-spacing:1.6px;color:var(--gold);text-transform:uppercase}
.who{margin-left:auto;text-align:right;font-size:11.5px;color:var(--mut);line-height:1.25}
.who b{display:block;color:var(--txt);font-size:13px}
.wrap{max-width:1080px;margin:0 auto;padding:14px}

/* ---------- the master red box ---------- */
.master{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:14px}
.master div{background:var(--panel);padding:11px 12px}
.master .n{font-family:var(--mono);font-size:24px;font-weight:700;line-height:1}
.master .l{font-size:10.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--mut);margin-top:5px}
.master .open{background:var(--red-dim)} .master .open .n{color:var(--red)}
.master .warn .n{color:var(--gold)}
.master .ok .n{color:var(--grn)}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);
  color:var(--mut);font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tab.on{background:var(--txt);color:var(--ink);border-color:var(--txt)}
.tab .pip{min-width:19px;height:19px;border-radius:999px;background:var(--red);color:#fff;font-size:11px;
  font-weight:700;display:grid;place-items:center;padding:0 5px;font-family:var(--mono)}
.tab.on .pip{background:var(--red)}

/* ---------- cards ---------- */
.sec-h{display:flex;align-items:baseline;gap:9px;margin:18px 0 9px}
.sec-h h3{margin:0;font-size:13px;letter-spacing:1.3px;text-transform:uppercase;color:var(--mut);font-weight:700}
.sec-h .ct{font-family:var(--mono);font-size:12px;color:var(--dim)}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 14px 13px 17px;margin-bottom:10px;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--line)}
.card.r::before{background:var(--red)} .card.a::before{background:var(--gold)}
.card.g::before{background:var(--grn)} .card.b::before{background:var(--blu)}
.card.dead{opacity:.55}
.hd{display:flex;align-items:flex-start;gap:10px}
.hd .nm{font-weight:700;font-size:16px;letter-spacing:-.2px}
.hd .ph{font-family:var(--mono);font-size:12.5px;color:var(--mut)}
.hd .rt{margin-left:auto;text-align:right;flex:0 0 auto}
.chip{display:inline-block;padding:3px 8px;border-radius:6px;font-size:10.5px;font-weight:700;
  letter-spacing:.7px;text-transform:uppercase}
.c-red{background:var(--red-dim);color:var(--red)} .c-amb{background:var(--gold-dim);color:var(--gold)}
.c-grn{background:var(--grn-dim);color:var(--grn)} .c-blu{background:var(--blu-dim);color:var(--blu)}
.c-gry{background:#202A3C;color:var(--mut)}
.meta{display:flex;flex-wrap:wrap;gap:5px 14px;margin-top:9px;font-size:12.5px;color:var(--mut)}
.meta b{color:var(--txt);font-weight:600}
.note{background:#111827;border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-top:10px;font-size:13.5px}
.note .lbl{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);margin-bottom:3px}

/* ---------- SIGNATURE: the gap rail ---------- */
.rail{margin:13px 0 4px}
.rail .bar{position:relative;height:34px;background:#0B111C;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.rail .fillbad{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--red-dim),transparent)}
.rail .fillok{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,transparent,var(--grn-dim))}
.rail .tick{position:absolute;top:0;bottom:0;width:2px;background:var(--mut)}
.rail .tick.floor{background:var(--gold);box-shadow:0 0 8px var(--gold)}
.rail .tick.secret{background:var(--grn);width:2px;box-shadow:0 0 8px var(--grn)}
.rail .tick.offer{background:var(--red);width:3px;box-shadow:0 0 10px var(--red)}
.rail .tick span{position:absolute;top:-1px;font-family:var(--mono);font-size:9.5px;letter-spacing:.4px;
  white-space:nowrap;padding:1px 4px;border-radius:4px;background:#0B111C;border:1px solid var(--line)}
.rail .tick.offer span{left:4px;color:var(--red);border-color:var(--red)}
.rail .tick.floor span{right:4px;color:var(--gold);border-color:var(--gold-dim)}
.rail .tick.secret span{right:4px;top:16px;color:var(--grn);border-color:var(--grn-dim)}
.rail .cap{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:5px}
.gap{font-family:var(--mono);font-weight:700}
.gap.bad{color:var(--red)} .gap.ok{color:var(--grn)} .gap.mid{color:var(--gold)}

/* ---------- buttons ---------- */
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}
.btn{padding:9px 13px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);color:var(--txt);
  font-weight:650;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:active{transform:translateY(1px)}
.btn.p{background:var(--gold);border-color:var(--gold);color:#1A1206}
.btn.ok{background:var(--grn);border-color:var(--grn);color:#04231A}
.btn.dgr{background:var(--red);border-color:var(--red);color:#fff}
.btn.gh{background:transparent;color:var(--mut)}
.btn.sm{padding:6px 10px;font-size:12.5px}
.btn.wide{flex:1;justify-content:center}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ---------- forms ---------- */
.f{margin-bottom:12px}
.f label{display:block;font-size:11px;letter-spacing:.9px;text-transform:uppercase;color:var(--mut);margin-bottom:5px;font-weight:650}
.f label i{color:var(--red);font-style:normal}
.in,select.in,textarea.in{width:100%;padding:11px 12px;background:#0B111C;border:1px solid var(--line);
  border-radius:9px;color:var(--txt);outline:none}
.in:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,176,32,.12)}
textarea.in{min-height:78px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.hint{font-size:11.5px;color:var(--dim);margin-top:5px}
.err{color:var(--red);font-size:12.5px;margin-top:6px;font-weight:600}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:9px;border-radius:9px;border:1px solid var(--line);background:#0B111C;color:var(--mut);font-weight:650;cursor:pointer;font-size:13px}
.seg button.on{color:var(--ink)}
.seg button.on[data-v=urgent]{background:var(--red);border-color:var(--red);color:#fff}
.seg button.on[data-v=normal]{background:var(--gold);border-color:var(--gold)}
.seg button.on[data-v=cold]{background:var(--blu);border-color:var(--blu);color:#fff}

/* ---------- calc box ---------- */
.calc{background:linear-gradient(180deg,#141D2E,#101825);border:1px solid var(--line);border-radius:var(--r);padding:13px;margin-bottom:12px}
.calc .out{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-top:11px}
.calc .out div{background:#0B111C;padding:9px 11px}
.calc .out .k{font-size:10px;letter-spacing:.9px;text-transform:uppercase;color:var(--dim)}
.calc .out .v{font-family:var(--mono);font-size:17px;font-weight:700;margin-top:2px}

/* ---------- shots ---------- */
.shots{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.shot{width:70px;height:70px;border-radius:9px;border:1px solid var(--line);object-fit:cover;cursor:zoom-in;background:#0B111C}
.shot.pdf{display:grid;place-items:center;font-size:10px;color:var(--gold);font-weight:700;text-align:center;text-decoration:none}
.drop{border:1.5px dashed var(--line);border-radius:9px;padding:15px;text-align:center;color:var(--mut);font-size:13px;cursor:pointer}
.drop.need{border-color:var(--red);color:var(--red)}

/* ---------- misc ---------- */
.empty{text-align:center;padding:34px 16px;color:var(--dim)}
.empty b{display:block;color:var(--mut);font-size:15px;margin-bottom:4px}
.tl{border-left:2px solid var(--line);margin:11px 0 0 5px;padding-left:13px}
.tl .e{margin-bottom:11px;position:relative}
.tl .e::before{content:"";position:absolute;left:-18px;top:6px;width:8px;height:8px;border-radius:99px;background:var(--line)}
.tl .e.own::before{background:var(--gold)} .tl .e.sal::before{background:var(--blu)}
.tl .w{font-size:11px;color:var(--dim);font-family:var(--mono)}
.tl .t{font-size:13.5px}
.modal{position:fixed;inset:0;background:rgba(6,10,17,.82);z-index:90;display:flex;align-items:flex-end;justify-content:center;padding:0}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;max-width:560px;
  max-height:92vh;overflow:auto;padding:16px 15px 24px}
.sheet h3{margin:0 0 12px;font-size:17px}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(14,20,32,.96);border-top:1px solid var(--line);
  padding:9px 12px calc(9px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:50;backdrop-filter:blur(8px)}
.bar .btn{flex:1;justify-content:center;padding:12px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:10px;letter-spacing:.9px;text-transform:uppercase;color:var(--dim);padding:7px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px;border-bottom:1px solid #1C2536}
.tbl td.n{font-family:var(--mono);text-align:right}
.banner{background:var(--blu-dim);border:1px solid #234070;color:#A9C7FF;padding:9px 12px;border-radius:9px;font-size:12.5px;margin-bottom:12px}
.pulse{animation:pl 1.8s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
@media(max-width:560px){.g3{grid-template-columns:1fr 1fr}.master .n{font-size:20px}}
/* login */
.login{max-width:380px;margin:9vh auto;padding:22px}
.login .lg{font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1}
.login .lg em{font-style:normal;color:var(--gold)}
.login .sub{color:var(--mut);font-size:13px;margin:8px 0 26px}
.pins{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}
.pins button{padding:15px;border-radius:11px;border:1px solid var(--line);background:var(--panel);color:var(--txt);
  font-family:var(--mono);font-size:19px;font-weight:700;cursor:pointer}
.dots{display:flex;gap:9px;justify-content:center;margin:16px 0}
.dots i{width:12px;height:12px;border-radius:99px;background:var(--line);display:block}
.dots i.f{background:var(--gold)}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
/* ==================================================================
   1. CONFIG  — apna Firebase config yahan paste karein
   ================================================================== */
const FB_CONFIG = {
  apiKey:            "",
  authDomain:        "",
  databaseURL:       "",
  projectId:         "",
  storageBucket:     "",
  messagingSenderId: "",
  appId:             ""
};
const ROOT = 'dealDesk';          // Sales Tracker ka data safe rehta hai
const MODELS_MIRROR = 'models';   // Sales Tracker ka rate node (import ke liye)

/* ==================================================================
   2. DATA LAYER  (Firebase agar config ho, warna in-memory demo)
   ================================================================== */
let LIVE = false, fdb = null;
try{
  if(FB_CONFIG.databaseURL && window.firebase){
    firebase.initializeApp(FB_CONFIG); fdb = firebase.database(); LIVE = true;
  }
}catch(e){ console.warn('Firebase off:', e.message); }

const LOCAL = {};                    // demo store
const subs  = [];                    // {path, cb}
function _get(o,path){ return path.split('/').filter(Boolean).reduce((a,k)=> (a==null?null:a[k]), o); }
function _set(o,path,v){ const ks=path.split('/').filter(Boolean); let c=o;
  ks.slice(0,-1).forEach(k=>{ if(typeof c[k]!=='object'||c[k]===null) c[k]={}; c=c[k]; });
  if(v===null) delete c[ks[ks.length-1]]; else c[ks[ks.length-1]]=v; }
function fire(){ subs.forEach(s=> s.cb(_get(LOCAL,s.path))); }

const DB = {
  watch(path, cb){
    if(LIVE) fdb.ref(ROOT+'/'+path).on('value', s=> cb(s.val()));
    else { subs.push({path,cb}); cb(_get(LOCAL,path)); }
  },
  set(path, v){ if(LIVE) return fdb.ref(ROOT+'/'+path).set(v); _set(LOCAL,path,v); fire(); return Promise.resolve(); },
  update(path, o){ if(LIVE) return fdb.ref(ROOT+'/'+path).update(o);
    Object.keys(o).forEach(k=> _set(LOCAL, path+'/'+k, o[k])); fire(); return Promise.resolve(); },
  push(path, v){ if(LIVE){ const r=fdb.ref(ROOT+'/'+path).push(); r.set(v); return r.key; }
    const id='L'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
    _set(LOCAL, path+'/'+id, v); fire(); return id; },
  raw(path){ // Sales Tracker node (ROOT ke bahar) — import ke liye
    if(!LIVE) return Promise.resolve(null);
    return fdb.ref(path).once('value').then(s=> s.val());
  }
};

/* ==================================================================
   3. STATE
   ================================================================== */
const S = { me:null, tab:'', leads:{}, reqs:{}, staff:{}, models:{}, cfg:{}, media:{}, now:Date.now() };
const $  = s=> document.querySelector(s);
const app= $('#app');

const RAM_D = {4:-3000, 8:0, 16:6000, 24:11000, 32:16000};
const SSD_D = {128:-3000, 256:0, 512:5000, 1024:11000, 2048:22000};

const PKR = n => (n==null||isNaN(n)) ? '—' : 'Rs ' + Number(n).toLocaleString('en-PK');
const K   = n => (n==null||isNaN(n)) ? '—' : (Math.round(Number(n)/100)/10) + 'k';
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = ()=> new Date().toISOString().slice(0,10);
const dayDiff = d => Math.round((new Date(d+'T00:00:00') - new Date(today()+'T00:00:00'))/864e5);
function ago(ts){ if(!ts) return '';
  const m = Math.floor((S.now-ts)/60000);
  if(m<1) return 'abhi'; if(m<60) return m+' min'; const h=Math.floor(m/60);
  if(h<24) return h+' ghante'; return Math.floor(h/24)+' din'; }
function stamp(ts){ if(!ts) return ''; const d=new Date(ts);
  return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'})+' '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); }
function dLabel(d){ if(!d) return '—'; const n=dayDiff(d);
  if(n===0) return 'AAJ'; if(n===1) return 'KAL'; if(n<0) return Math.abs(n)+' din guzar gaye';
  return n+' din baad'; }
function toast(msg, kind){
  const t=document.createElement('div'); t.textContent=msg;
  t.style.cssText='position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:99;padding:11px 18px;'+
    'border-radius:10px;font-weight:650;font-size:14px;max-width:88vw;text-align:center;'+
    (kind==='bad'?'background:#FF4757;color:#fff':'background:#16C784;color:#04231A');
  document.body.appendChild(t); setTimeout(()=>t.remove(),2600);
}
function waLink(phone, text){
  const p = String(phone||'').replace(/\D/g,'').replace(/^0/,'92');
  return 'https://wa.me/'+p+'?text='+encodeURIComponent(text||'');
}

/* ==================================================================
   4. RATE CALCULATOR
   ================================================================== */
function calcRate(modelKey, ram, ssd){
  const m = S.models[modelKey]; if(!m) return null;
  const d = (RAM_D[ram]||0) + (SSD_D[ssd]||0);
  const base = Number(m.base)||0;
  return {
    model: m.name,
    list:  base + d,                                   // list / demand rate
    floor: (Number(m.sellMin)||base) + d,              // salesperson ko yahi dikhta hai
    auto:  m.autoMin ? (Number(m.autoMin)+d) : null    // owner ka asli farsh (secret)
  };
}
function gapClass(gap, band){ if(gap<=0) return 'ok'; if(gap<=band) return 'mid'; return 'bad'; }

/* ==================================================================
   5. LEAD STATUS  — kis ke court mein ball hai
   ================================================================== */
// pending  -> owner RED, sales AMBER (intezar)
// approved -> sales RED  (customer ko close karo / date lo), owner GREEN
// rejected -> sales RED, owner GREEN
// booked   -> AMBER, date se 1 din pehle + us din RED (dono ko)
// won/lost -> GREEN / GREY
function courtOf(l, role){
  if(l.status==='won')  return 'g';
  if(l.status==='lost') return 'x';
  if(l.status==='pending')  return role==='owner' ? 'r' : 'a';
  if(l.status==='approved'|| l.status==='rejected') return role==='owner' ? 'g' : 'r';
  if(l.status==='booked'){ const n=dayDiff(l.visitDate); return n<=1 ? 'r' : 'a'; }
  return 'b';
}
const STAT = {
  pending :{t:'Owner ke paas',   c:'c-red'},
  approved:{t:'Approved',        c:'c-grn'},
  rejected:{t:'Rate reject',     c:'c-red'},
  booked  :{t:'Date li hui hai', c:'c-amb'},
  won     :{t:'Sale done',       c:'c-grn'},
  lost    :{t:'Lost',            c:'c-gry'}
};
const isOpen = l => l.status!=='won' && l.status!=='lost';
function myLeads(){
  return Object.entries(S.leads).map(([id,l])=>({id,...l}))
    .filter(l=> S.me.role==='owner' ? true : l.by===S.me.id)
    .sort((a,b)=> (b.updatedAt||0)-(a.updatedAt||0));
}

/* ==================================================================
   6. SEED  (pehli baar / demo mode)
   ================================================================== */
const SEED_STAFF = {
  o1:{name:'Owner',      pin:'1111', role:'owner'},
  s1:{name:'Salesman 1', pin:'1001', role:'sales'},
  s2:{name:'Salesman 2', pin:'1002', role:'sales'},
  s3:{name:'Salesman 3', pin:'1003', role:'sales'},
  s4:{name:'Salesman 4', pin:'1004', role:'sales'},
  s5:{name:'Salesman 5', pin:'1005', role:'sales'},
  s6:{name:'Salesman 6', pin:'1006', role:'sales'},
  s7:{name:'Salesman 7', pin:'1007', role:'sales'}
};
const SEED_MODELS = {
  m1:{name:'Dell Latitude 5420 i5 11th',  base:118000, sellMin:110000, autoMin:94000},
  m2:{name:'HP EliteBook 840 G8 i7 11th', base:142000, sellMin:133000, autoMin:118000},
  m3:{name:'Lenovo ThinkPad T14 i5 10th', base:104000, sellMin: 97000, autoMin: 86000},
  m4:{name:'Dell Precision 5540 i7 + T2000', base:195000, sellMin:185000, autoMin:168000},
  m5:{name:'HP ZBook Firefly G8 i7',      base:168000, sellMin:158000, autoMin:142000}
};
const SEED_CFG = { autoBand:4000, slaMin:20, ownerWa:'', currency:'PKR' };

function safeRender(){
  if(document.querySelector('.modal')) return;                 // sheet khuli hai
  if(S.me && S.tab==='new'){
    keepDraft();
    const a=document.activeElement;
    if(a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return;    // likhte waqt form na hile
  }
  render();
}
function boot(){
  if(!LIVE){ _set(LOCAL,'staff',SEED_STAFF); _set(LOCAL,'models',SEED_MODELS);
             _set(LOCAL,'config',SEED_CFG); seedDemoLeads(); }
  DB.watch('leads',  v=>{ S.leads = v||{};  safeRender(); });
  DB.watch('reqs',   v=>{ S.reqs  = v||{};  safeRender(); });
  DB.watch('staff',  v=>{ if(!v && LIVE){ DB.set('staff', SEED_STAFF); return; } S.staff=v||{}; safeRender(); });
  DB.watch('models', v=>{ if(!v && LIVE){ DB.set('models', SEED_MODELS); return; } S.models=v||{}; safeRender(); });
  DB.watch('config', v=>{ if(!v && LIVE){ DB.set('config', SEED_CFG); return; } S.cfg=v||SEED_CFG; safeRender(); });
  DB.watch('media',  v=>{ S.media = v||{}; });
  setInterval(()=>{ S.now=Date.now(); if(S.me) safeRender(); }, 60000);
}

window.pin = v =>{
  if(v==='c'){ pinBuf=pinBuf.slice(0,-1); }
  else if(v==='go'){
    const id = whoSel || ($('#who')||{}).value, st = S.staff[id];
    if(st && st.pin===pinBuf){ S.me={id,...st}; S.tab = st.role==='owner'?'inbox':'dash'; pinBuf=''; render(); return; }
    pinBuf=''; render(); const e=$('#lerr'); if(e) e.textContent='PIN ghalat hai. Dobara koshish karein.'; return;
  }
  else if(pinBuf.length<4){ pinBuf+=v; }
  render();
  if(pinBuf.length===4) setTimeout(()=>window.pin('go'),120);
};

function railHTML(l){
  const offer = Number(l.offer)||0, floor = Number(l.floor)||0, auto = Number(l.autoMin)||0;
  const lo = Math.min(offer, auto||floor, floor)*0.97, hi = Math.max(offer, floor, Number(l.list)||floor)*1.03;
  const pos = v => Math.max(1, Math.min(99, ((v-lo)/(hi-lo||1))*100));
  const owner = S.me.role==='owner';
  const gap = floor - offer;
  return `<div class="rail">
    <div class="bar">
      <div class="fillbad" style="width:${pos(offer)}%"></div>
      <div class="fillok" style="left:${pos(floor)}%;right:0"></div>
      ${owner && auto ? `<div class="tick secret" style="left:${pos(auto)}%"><span>asli farsh ${K(auto)}</span></div>`:''}
      <div class="tick floor" style="left:${pos(floor)}%"><span>company min ${K(floor)}</span></div>
      <div class="tick offer" style="left:${pos(offer)}%"><span>offer ${K(offer)}</span></div>
    </div>
    <div class="cap"><span>${PKR(offer)} customer</span>
      <span class="gap ${gapClass(gap, S.cfg.autoBand||4000)}">${gap>0?'−'+PKR(gap).replace('Rs ','Rs '):'+'+PKR(-gap).replace('Rs ','Rs ')} ${gap>0?'kam':'upar'}</span>
      <span>${PKR(floor)} min</span></div>
  </div>`;
}

function shotsHTML(id){

  return `<div class="shots">${m.files.map((f,i)=> f.type==='pdf'
    ? `<a class="shot pdf" href="${f.d}" download="${esc(f.n||'file.pdf')}">PDF<br>${esc((f.n||'').slice(0,9))}</a>`
    : `<img class="shot" src="${f.d}" onclick="zoom('${id}',${i})">`).join('')}</div>`;
}

function leadCard(l, opts={}){

  const pri = {urgent:['c-red','URGENT'],normal:['c-amb','NORMAL'],cold:['c-blu','COLD']}[l.priority||'normal'];
  const wait = l.status==='pending' ? ago(l.sentAt||l.createdAt) : '';
  const late = l.status==='pending' && (S.now-(l.sentAt||l.createdAt)) > (S.cfg.slaMin||20)*60000;
  return `<div class="card ${court==='x'?'dead':court}">
    <div class="hd">
      <div>
        <div class="nm">${esc(l.name)}</div>
        <div class="ph">${esc(l.phone)} · ${esc(sales)}</div>
      </div>
      <div class="rt">
        <span class="chip ${pri[0]}">${pri[1]}</span>
        <div style="margin-top:5px"><span class="chip ${st.c}">${st.t}</span></div>
        ${wait?`<div class="ph ${late?'':''}" style="margin-top:5px;color:${late?'var(--red)':'var(--dim)'}">${wait} se intezar</div>`:''}
      </div>
    </div>

    <div class="meta">
      <span>Model <b>${esc(l.model)}</b></span>
      <span>Spec <b>${l.ram}GB / ${l.ssd>=1024?(l.ssd/1024)+'TB':l.ssd+'GB'}</b></span>
      <span>Budget <b>${PKR(l.budget)}</b></span>
      <span>Use <b>${esc(l.usage||'—')}</b></span>
    </div>

    ${railHTML(l)}

    ${l.desc?`<div class="note"><div class="lbl">Kahan atka hai</div>${esc(l.desc)}</div>`:''}
    ${l.askType?`<div class="note"><div class="lbl">Salesperson ki request</div>${l.askType==='call'?'Aap khud customer ko call karein':esc(l.askText)}</div>`:''}
    ${shotsHTML(l.id)}
    ${l.status==='booked'?`<div class="note" style="border-color:${dayDiff(l.visitDate)<=1?'var(--red)':'var(--gold)'}">
        <div class="lbl">Customer aane ki date</div>
        <b class="mono">${l.visitDate}</b> — ${dLabel(l.visitDate)} ${l.rebook?` · ${l.rebook} baar date barh chuki hai`:''}</div>`:''}
    ${l.status==='lost'?`<div class="note"><div class="lbl">Lost — wajah</div>${esc(l.lostReason)}${l.lostNote?' — '+esc(l.lostNote):''}</div>`:''}
    ${(l.rounds&&l.rounds.length)?`<details><summary style="cursor:pointer;color:var(--mut);font-size:12.5px;margin-top:10px">Poori baat-cheet (${l.rounds.length})</summary>
      <div class="tl">${l.rounds.map(r=>`<div class="e ${r.role==='owner'?'own':'sal'}">
        <div class="w">${esc(r.who)} · ${stamp(r.at)}</div>
        <div class="t">${esc(r.text)}${r.rate?` <b class="mono" style="color:var(--gold)">${PKR(r.rate)}</b>`:''}</div></div>`).join('')}</div></details>`:''}
    <div class="row">${actionBtns(l).join('')}</div>
  </div>`;
}

function actionBtns(l){
  const owner = S.me.role==='owner', B=[];
  const call = `<a class="btn sm" href="tel:${esc(l.phone)}">Call</a>`;
  const wa   = `<a class="btn sm" target="_blank" href="${waLink(l.phone,'Assalam o alaikum '+l.name+' — Denzen Computers se. Aapke '+l.model+' ke baare mein baat karni thi.')}">WhatsApp</a>`;
  if(l.status==='won'||l.status==='lost') return [`<button class="btn gh sm" onclick="reopen('${l.id}')">Dobara kholein</button>`];
  if(owner){
    if(l.status==='pending'){
      B.push(`<button class="btn ok wide" onclick="answer('${l.id}','approve')">Rate approve</button>`);
      B.push(`<button class="btn dgr wide" onclick="answer('${l.id}','reject')">Reject</button>`);
      B.push(call, wa);
    } else {
      B.push(`<button class="btn sm" onclick="answer('${l.id}','note')">Note likhein</button>`, call, wa);
      if(l.status!=='won') B.push(`<button class="btn ok sm" onclick="won('${l.id}')">Sale done</button>`);
    }
  } else {
    if(l.status==='pending') B.push(`<button class="btn gh sm" disabled>Owner ke jawab ka intezar</button>`,
      `<a class="btn sm" target="_blank" href="${waLink(S.cfg.ownerWa,'Deal Desk — '+l.name+' ki lead pending hai ('+l.model+', gap '+K((l.floor||0)-(l.offer||0))+'). Dekh lein.')}">Owner ko yaad dilayen</a>`);
    if(l.status==='approved'||l.status==='rejected'){
      B.push(`<button class="btn p wide" onclick="book('${l.id}')">Customer ne date di</button>`);
      B.push(`<button class="btn ok sm" onclick="won('${l.id}')">Abhi sale ho gayi</button>`);
      B.push(`<button class="btn sm" onclick="resend('${l.id}')">Naya masla — owner ko bhejein</button>`);
      B.push(`<button class="btn dgr sm" onclick="lost('${l.id}')">Lost</button>`, call, wa);
    }
    if(l.status==='booked'){
      B.push(`<button class="btn ok wide" onclick="won('${l.id}')">Customer aa gaya — done</button>`);
      B.push(`<button class="btn p sm" onclick="book('${l.id}')">Nayi date</button>`);
      B.push(`<button class="btn dgr sm" onclick="lost('${l.id}')">Nahi le raha</button>`, call, wa);
    }
  }
  return B;
}

function group(list, title, hint){
  if(!list.length) return '';
  return `<div class="sec-h"><h3>${title}</h3><span class="ct">${list.length}</span>${hint?`<span class="ct" style="margin-left:auto">${hint}</span>`:''}</div>`
    + list.map(l=>leadCard(l)).join('');
}
const empty = (t,s)=>`<div class="empty"><b>${t}</b>${s||''}</div>`;

/* ==================================================================
   10. VIEWS — lists
   ================================================================== */
function viewInbox(){
  const all = myLeads(), open = all.filter(isOpen);
  const pend = open.filter(l=>l.status==='pending')
    .sort((a,b)=> ({urgent:0,normal:1,cold:2}[a.priority||'normal'] - {urgent:0,normal:1,cold:2}[b.priority||'normal'])
      || (a.sentAt||0)-(b.sentAt||0));
  const todayL = open.filter(l=> l.status==='booked' && dayDiff(l.visitDate)<=1);
  const stale  = open.filter(l=> (l.status==='approved'||l.status==='rejected') && (S.now-(l.updatedAt||0))>24*3600e3);
  if(!open.length && !all.length) return empty('Abhi koi lead nahi','Salesperson lead bhejega to yahan aayegi.');
  return group(pend,'Aapka jawab chahiye','sabse purani pehle')
    + group(todayL,'Aaj / kal aane wale')
    + group(stale,'24 ghante se koi hulchul nahi')
    + (pend.length?'':'<div class="empty"><b>Inbox saaf hai</b>Koi rate pending nahi.</div>');
}
function viewBoard(){
  const all = myLeads();
  return group(all.filter(l=>l.status==='pending'),'Pending')
    + group(all.filter(l=>l.status==='approved'||l.status==='rejected'),'Jawab de diya — salesperson ke paas')
    + group(all.filter(l=>l.status==='booked'),'Date li hui hai')
    + group(all.filter(l=>l.status==='won'),'Done')
    + group(all.filter(l=>l.status==='lost'),'Lost')
    + (all.length?'':empty('Board khali hai'));
}
function viewDash(){
  const all = myLeads(), open = all.filter(isOpen);
  const act  = open.filter(l=> courtOf(l,'sales')==='r');
  const wait = open.filter(l=> l.status==='pending');
  const book = open.filter(l=> l.status==='booked' && dayDiff(l.visitDate)>1);
  const done = all.filter(l=> !isOpen(l)).slice(0,12);
  if(!all.length) return empty('Koi lead nahi','Neeche “+ Nayi Lead” se shuru karein.');
  return group(act,'Aap kuch karein','jab tak khali na ho, lead zinda hai')
    + group(wait,'Owner ke paas hai')
    + group(book,'Aane wali dates')
    + group(done,'Purani');
}

/* ---------- file pick + compress ---------- */
function shrink(file){
  return new Promise(res=>{
    if(file.type==='application/pdf'){
      const r=new FileReader(); r.onload=()=>res({type:'pdf',n:file.name,d:r.result}); r.readAsDataURL(file); return;
    }
    const r=new FileReader();
    r.onload=()=>{ const img=new Image();
      img.onload=()=>{ const mx=1200, sc=Math.min(1,mx/Math.max(img.width,img.height));
        const cv=document.createElement('canvas'); cv.width=img.width*sc; cv.height=img.height*sc;
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
        res({type:'img',n:file.name,d:cv.toDataURL('image/jpeg',0.62)}); };
      img.src=r.result; };
    r.readAsDataURL(file);
  });
}
window.pickFiles = async ev =>{
  keepDraft();
  const fs=[...ev.target.files].slice(0,5);
  for(const f of fs){ if(draft.shots.length>=5){ toast('5 se zyada nahi','bad'); break; } draft.shots.push(await shrink(f)); }
  render();
};

/* ---------- submit ---------- */
window.submitLead = ()=>{
  keepDraft();
  const e=$('#nerr'), miss=[];
  if(!draft.name) miss.push('naam'); if(!draft.phone) miss.push('phone');
  if(!draft.budget) miss.push('budget'); if(!draft.offer) miss.push('customer ki offer');
  if(!draft.desc) miss.push('baat kahan atki hai');
  if(draft.shots.length<2) miss.push('kam az kam 2 screenshot');
  if(miss.length){ e.textContent='Ye cheezein reh gayi hain: '+miss.join(', ')+'.'; window.scrollTo(0,document.body.scrollHeight); return; }
  const r = calcRate(draft.model || Object.keys(S.models)[0], draft.ram, draft.ssd);
  if(!r){ e.textContent='Pehle Rates tab mein model ka rate daalna hoga.'; return; }
  const offer = Number(draft.offer);
  const ask = $('#fAsk').value, askText = $('#fAskText').value;
  const auto = r.auto, band = Number(S.cfg.autoBand)||0;
  const autoOK = auto && offer >= auto;                 // owner ka silent rule
  const now = Date.now();
  const lead = {
    name:draft.name, phone:draft.phone, budget:+draft.budget, usage:draft.usage||'', detail:draft.detail||'',
    modelKey:draft.model, model:r.model, ram:draft.ram||8, ssd:draft.ssd||256,
    list:r.list, floor:r.floor, autoMin:auto||null, offer, gap:r.floor-offer,
    desc:draft.desc, askType:(ask==='rate'?null:ask), askText:askText||'',
    priority:draft.priority, by:S.me.id, byName:S.me.name,
    status: autoOK ? 'approved' : 'pending',
    finalRate: autoOK ? offer : null,
    createdAt:now, sentAt:now, updatedAt:now,
    rounds: [{who:S.me.name, role:'sales', text:draft.desc + ' — offer ' , rate:offer, at:now}]
      .concat(autoOK ? [{who:'System', role:'owner', text:'Rate khud-ba-khud approve — offer owner ke rule ke andar hai.', rate:offer, at:now}] : [])
  };
  const id = DB.push('leads', lead);
  if(draft.shots.length) DB.set('media/'+id, {files:draft.shots});
  draft = {priority:'normal', shots:[]};
  toast(autoOK ? 'Approved! Rs '+offer.toLocaleString()+' par band kar dein.' : 'Owner ko bhej diya.');
  S.tab='dash'; render(); window.scrollTo(0,0);
};

};
window.delModel = k =>{ DB.set('models/'+k, null); closeSheet(); toast('Hata diya'); };
window.importModels = async ()=>{
  const v = await DB.raw(MODELS_MIRROR);
  if(!v){ toast('Sales Tracker mein models nahi mile','bad'); return; }
  const out={};
  Object.entries(v).forEach(([k,m])=>{
    const name = m.name||m.model||m.title||k;
    const base = +(m.base||m.price||m.rate||m.list||0);
    const min  = +(m.min||m.sellMin||m.least||m.minPrice||base);
    if(name && base) out[k]={name, base, sellMin:min||base, autoMin:+(m.autoMin||0)};
  });
  if(!Object.keys(out).length){ toast('Rate data samajh nahi aaya — manually add karein','bad'); return; }
  DB.update('models', out); toast(Object.keys(out).length+' model import ho gaye');
};

/* ==================================================================
   15. REPORT (owner) — yehi batata hai ke floor kahan ghalat hai
   ================================================================== */
function viewReport(){
  const all = Object.entries(S.leads).map(([id,l])=>({id,...l}));
  if(!all.length) return empty('Report ke liye data nahi');
  const won = all.filter(l=>l.status==='won'), lost = all.filter(l=>l.status==='lost');
  const closed = won.length+lost.length;
  const conv = closed? Math.round(won.length/closed*100):0;
  const disc = won.reduce((s,l)=> s + Math.max(0,(l.floor||0)-(l.finalRate||l.offer||0)), 0);
  const answered = all.filter(l=>l.ownerAt&&l.sentAt);
  const avgResp = answered.length ? Math.round(answered.reduce((s,l)=>s+(l.ownerAt-l.sentAt),0)/answered.length/60000) : null;
  const lostPrice = lost.filter(l=>/rate|sasta/i.test(l.lostReason||''));
  const avgLostGap = lostPrice.length ? Math.round(lostPrice.reduce((s,l)=>s+((l.floor||0)-(l.offer||0)),0)/lostPrice.length) : 0;

  const why = {}; lost.forEach(l=> why[l.lostReason||'—']=(why[l.lostReason||'—']||0)+1);
  const per = {}; all.forEach(l=>{ const n=(S.staff[l.by]||{}).name||'—';
    per[n]=per[n]||{t:0,w:0,l:0,d:0}; per[n].t++;
    if(l.status==='won'){per[n].w++; per[n].d+=Math.max(0,(l.floor||0)-(l.finalRate||0));}
    if(l.status==='lost') per[n].l++; });

  return `<div class="master" style="grid-template-columns:1fr 1fr">
      <div class="ok"><div class="n">${conv}%</div><div class="l">Band leads mein se jeeti</div></div>
      <div class="warn"><div class="n">${avgResp==null?'—':avgResp+'m'}</div><div class="l">Aapka ausat jawab time</div></div>
    </div>
    <div class="card">
      <div class="meta" style="font-size:14px">
        <span>Kul leads <b>${all.length}</b></span><span>Jeeti <b style="color:var(--grn)">${won.length}</b></span>
        <span>Lost <b style="color:var(--red)">${lost.length}</b></span>
        <span>Kul diya gaya discount <b class="mono">${PKR(disc)}</b></span>
      </div>
      ${avgLostGap>0?`<div class="note" style="border-color:var(--gold);margin-top:12px">
        <div class="lbl">Dhyaan dein</div>Rate ki wajah se ${lostPrice.length} leads gayi hain.
        In mein customer ausatan <b class="mono" style="color:var(--gold)">${PKR(avgLostGap)}</b> kam de raha tha —
        agar itna gunjaish hai to “asli farsh” Rates tab mein utna neeche kar dein, phir yeh leads khud approve hongi.</div>`:''}
    </div>
    <div class="sec-h"><h3>Salesperson</h3></div>
    <div class="card"><table class="tbl"><thead><tr><th>Naam</th><th style="text-align:right">Leads</th>
      <th style="text-align:right">Jeeti</th><th style="text-align:right">Lost</th><th style="text-align:right">Discount</th></tr></thead>
      <tbody>${Object.entries(per).sort((a,b)=>b[1].w-a[1].w).map(([n,v])=>`<tr><td>${esc(n)}</td>
        <td class="n">${v.t}</td><td class="n" style="color:var(--grn)">${v.w}</td>
        <td class="n" style="color:var(--red)">${v.l}</td><td class="n">${PKR(v.d)}</td></tr>`).join('')}</tbody></table></div>
    ${Object.keys(why).length?`<div class="sec-h"><h3>Lost kyun hui</h3></div>
    <div class="card"><table class="tbl"><tbody>${Object.entries(why).sort((a,b)=>b[1]-a[1])
      .map(([w,c])=>`<tr><td>${esc(w)}</td><td class="n">${c}</td></tr>`).join('')}</tbody></table></div>`:''}`;
}

/* ==================================================================
   16. TEAM + settings (owner)
   ================================================================== */
function viewTeam(){
  return `<div class="sec-h"><h3>Team</h3><span class="ct">${Object.keys(S.staff).length}</span></div>
  <div class="card"><table class="tbl"><thead><tr><th>Naam</th><th>Role</th><th>PIN</th><th></th></tr></thead>
    <tbody>${Object.entries(S.staff).map(([k,s])=>`<tr><td>${esc(s.name)}</td><td>${s.role}</td>
      <td class="mono">${esc(s.pin)}</td><td><button class="btn sm gh" onclick="editStaff('${k}')">Edit</button></td></tr>`).join('')}</tbody></table>
    <div class="row"><button class="btn p" onclick="editStaff(null)">+ Naya banda</button></div></div>

  <div class="sec-h"><h3>Settings</h3></div>
  <div class="card">
    <div class="f"><label>Aapka WhatsApp number (yaad-dihani ke liye)</label>
      <input class="in mono" id="sWa" value="${esc(S.cfg.ownerWa||'')}" placeholder="923251548556"></div>
    <div class="f"><label>Kitni der baad lead “late” samjhi jaye (minute)</label>
      <input class="in mono" id="sSla" inputmode="numeric" value="${S.cfg.slaMin||20}"></div>
    <div class="f"><label>Chhota farq (is se kam gap “halka” dikhega)</label>
      <input class="in mono" id="sBand" inputmode="numeric" value="${S.cfg.autoBand||4000}"></div>
    <div class="row"><button class="btn p" onclick="saveCfg()">Save</button></div>
  </div>`;
}
window.saveCfg = ()=>{ DB.update('config', {ownerWa:$('#sWa').value.trim(), slaMin:+$('#sSla').value||20, autoBand:+$('#sBand').value||4000});
  toast('Save ho gaya'); };
window.editStaff = k =>{
  const s = k?S.staff[k]:{name:'',pin:'',role:'sales'};
  sheet(`<h3>${k?'Edit':'Naya banda'}</h3>
    <div class="f"><label>Naam <i>*</i></label><input class="in" id="tN" value="${esc(s.name)}"></div>
    <div class="f"><label>4 digit PIN <i>*</i></label><input class="in mono" id="tP" inputmode="numeric" maxlength="4" value="${esc(s.pin)}"></div>
    <div class="f"><label>Role</label><select class="in" id="tR">
      <option value="sales" ${s.role==='sales'?'selected':''}>Salesperson</option>
      <option value="owner" ${s.role==='owner'?'selected':''}>Owner</option></select></div>
    <div class="row"><button class="btn p wide" onclick="saveStaff('${k||''}')">Save</button>
      ${k&&k!==S.me.id?`<button class="btn dgr sm" onclick="delStaff('${k}')">Delete</button>`:''}
      <button class="btn gh" onclick="closeSheet()">Cancel</button></div>`);
};
window.saveStaff = k =>{
  const n=$('#tN').value.trim(), p=$('#tP').value.trim();
  if(!n||p.length!==4){ toast('Naam aur 4 digit PIN chahiye','bad'); return; }
  const o={name:n, pin:p, role:$('#tR').value};
  if(k) DB.update('staff/'+k, o); else DB.push('staff', o);
  closeSheet(); toast('Save ho gaya');
};
window.delStaff = k =>{ DB.set('staff/'+k, null); closeSheet(); toast('Hata diya'); };

/* ==================================================================
   17. GO
   ================================================================== */
boot();
render();
</script>
</body>
