<style>
:root{
  --bg:#F4F6FA; --card:#FFFFFF; --card2:#F7F9FD; --line:#E4E9F2; --line2:#EDF0F7;
  --txt:#141E33; --mut:#5B6980; --dim:#98A3B8;
  --blu:#2456E6; --blu-bg:#EBF1FF; --blu-tx:#1C43BC;
  --red:#E5484D; --red-bg:#FDE8E8; --red-tx:#C03538;
  --gold:#F0A800; --gold-bg:#FCF1CE; --gold-tx:#9A6700;
  --grn:#12B76A; --grn-bg:#DCF5E8; --grn-tx:#0B7A4B;
  --gry-bg:#EDF0F6;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --r:14px; --sh:0 1px 2px rgba(20,30,51,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);font-family:var(--ui);font-size:15px}
button{font-family:var(--ui)}
a{color:var(--blu-tx)}
:focus-visible{outline:2px solid var(--blu);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
.top{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:10px}
.brand{font-weight:800;letter-spacing:-.4px;font-size:17px}
.brand span{color:var(--blu)}
.brand small{display:block;font-weight:600;font-size:10px;letter-spacing:1.8px;color:var(--dim);text-transform:uppercase}
.who{margin-left:auto;text-align:right;font-size:11.5px;color:var(--mut);line-height:1.25}
.who b{display:block;color:var(--txt);font-size:13px}
.wrap{max-width:1040px;margin:0 auto;padding:14px 14px 110px}
.lockbar{position:sticky;top:52px;z-index:39;background:var(--red);color:#fff;font-weight:700;font-size:13px;
  padding:9px 14px;text-align:center;border-radius:10px;margin-bottom:12px}
.banner{background:var(--gold-bg);border:1px solid #EBD49A;color:var(--gold-tx);border-radius:10px;
  padding:9px 12px;font-size:12.5px;margin-bottom:12px}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);
  color:var(--mut);font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px;box-shadow:var(--sh)}
.tab.on{background:#17233C;color:#fff;border-color:#17233C}
.tab.alert{color:var(--red-tx);border-color:#F5C6C8}
.pip{min-width:19px;height:19px;border-radius:999px;background:var(--red);color:#fff;font-size:11px;
  font-weight:700;display:grid;place-items:center;padding:0 5px;font-family:var(--mono)}
.pip.g{background:var(--grn)}

/* ---------- stat boxes ---------- */
.master{display:grid;gap:8px;margin-bottom:14px}
.master>div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:var(--sh)}
.master .n{font-family:var(--mono);font-size:22px;font-weight:700;line-height:1}
.master .l{font-size:10px;letter-spacing:.7px;text-transform:uppercase;color:var(--mut);margin-top:5px;font-weight:600}
.master .red .n{color:var(--red)} .master .amb .n{color:var(--gold-tx)}
.master .grn .n{color:var(--grn-tx)} .master .blu .n{color:var(--blu-tx)} .master .gry .n{color:var(--mut)}
.pulse{animation:pu 1.6s infinite}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.45}}

/* ---------- alert boxes (COD waghera) ---------- */
.alert{border-radius:12px;padding:12px 14px;margin-bottom:9px;font-weight:650;border:1px solid;cursor:pointer;font-size:13.5px}
.alert .tmr{font-family:var(--mono);font-weight:800}
.alert.red{background:var(--red-bg);border-color:#F5C6C8;color:var(--red-tx)}
.alert.org{background:var(--gold-bg);border-color:#F0D9A8;color:var(--gold-tx)}
.alert.grn{background:var(--grn-bg);border-color:#A9DEC0;color:var(--grn-tx)}
.alert.big{font-size:15px;text-align:center;padding:15px}

/* ---------- section headers + dropdown groups ---------- */
.sec-h{display:flex;align-items:baseline;gap:9px;margin:18px 0 9px}
.sec-h h3{margin:0;font-size:12.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--mut);font-weight:700}
.sec-h .ct{font-family:var(--mono);font-size:12px;color:var(--dim)}
.drop-h{display:flex;align-items:center;gap:9px;margin:18px 0 9px;cursor:pointer;user-select:none;
  background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px;box-shadow:var(--sh)}
.drop-h h3{margin:0;font-size:12.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--mut);font-weight:700}
.drop-h .ct{font-family:var(--mono);font-size:12px;color:var(--dim)}
.drop-h .ch{margin-left:auto;color:var(--dim);font-size:13px}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--dim);font-size:13.5px;margin-bottom:10px}
.empty b{display:block;color:var(--mut);margin-bottom:4px;font-size:14.5px}

/* ---------- SIGNATURE: 1-inch deal card + Min/Offer/Farq strip ---------- */
.cc{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:10px 12px 10px 15px;margin-bottom:9px;box-shadow:var(--sh);cursor:pointer;overflow:hidden}
.cc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--line)}
.cc.r::before{background:var(--red)} .cc.a::before{background:var(--gold)}
.cc.g::before{background:var(--grn)} .cc.b::before{background:var(--blu)}
.cc.x{opacity:.6}
.cc .row1{display:flex;align-items:center;gap:8px}
.cc .nm{font-weight:750;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc .sub{font-size:11.5px;color:var(--mut);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc .end{margin-left:auto;flex:0 0 auto;display:flex;align-items:center;gap:7px}
.chip{display:inline-block;padding:3px 9px;border-radius:999px;font-size:10px;font-weight:750;letter-spacing:.5px;text-transform:uppercase}
.c-red{background:var(--red-bg);color:var(--red-tx)} .c-amb{background:var(--gold-bg);color:var(--gold-tx)}
.c-grn{background:var(--grn-bg);color:var(--grn-tx)} .c-blu{background:var(--blu-bg);color:var(--blu-tx)}
.c-gry{background:var(--gry-bg);color:var(--mut)}
.ub{min-width:20px;height:20px;border-radius:999px;background:var(--grn);color:#fff;font-size:11px;font-weight:800;
  display:grid;place-items:center;padding:0 6px;font-family:var(--mono);box-shadow:0 1px 3px rgba(18,183,106,.45)}
.trio{display:grid;grid-template-columns:1fr 1fr 1.1fr;gap:6px;margin-top:8px}
.trio>div{background:var(--card2);border:1px solid var(--line2);border-radius:9px;padding:5px 9px}
.trio i{display:block;font-style:normal;font-size:9px;letter-spacing:.8px;text-transform:uppercase;color:var(--dim);font-weight:700}
.trio b{font-family:var(--mono);font-size:13.5px;font-weight:700}
.trio .ok b{color:var(--grn-tx)} .trio .bad b{color:var(--red-tx)}
.trio .ok{background:var(--grn-bg);border-color:#A9DEC0} .trio .bad{background:var(--red-bg);border-color:#F5C6C8}

/* ---------- full-screen lead ---------- */
.fs{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch}
.fs .fhead{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;gap:10px}
.fs .fhead .nm{font-weight:800;font-size:17px;letter-spacing:-.2px}
.fs .fhead .ph{font-family:var(--mono);font-size:12px;color:var(--mut)}
.xbig{width:34px;height:34px;border-radius:99px;border:1px solid var(--line);background:var(--card2);
  color:var(--mut);font-size:15px;cursor:pointer;display:grid;place-items:center;flex:0 0 auto}
.fs .inner{max-width:760px;margin:0 auto;padding:14px 14px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px;box-shadow:var(--sh)}
.kvg{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.kv{background:var(--card2);border:1px solid var(--line2);border-radius:10px;padding:8px 11px}
.kv i{display:block;font-style:normal;font-size:9.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--dim);font-weight:700}
.kv b{font-size:13.5px;font-weight:700}
.kv b.mono{font-family:var(--mono)}
.note{background:var(--card2);border:1px solid var(--line2);border-radius:10px;padding:9px 11px;margin-top:10px;font-size:13.5px}
.note .lbl{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);margin-bottom:3px;font-weight:700}
.note.urg{background:#FFF5F5;border-color:#F5C6C8}
.note.hl{background:#F1FBF5;border-color:#BFE9CF}

/* ---------- chat ---------- */
.msgs{display:flex;flex-direction:column;gap:7px;margin:10px 0}
.m{max-width:84%;padding:8px 11px 5px;border-radius:13px;font-size:13.5px;line-height:1.4;background:#fff;border:1px solid var(--line)}
.m .w{font-size:9.5px;color:var(--dim);font-weight:700;margin-bottom:2px;letter-spacing:.4px;text-transform:uppercase}
.m .tm{font-size:9.5px;color:var(--dim);text-align:right;margin-top:3px;font-family:var(--mono)}
.m.me{align-self:flex-end;background:#E5EDFF;border-color:#CBDAFE;border-bottom-right-radius:4px}
.m.th{align-self:flex-start;border-bottom-left-radius:4px}
.chatrow{display:flex;gap:8px;margin-top:6px}
.chatrow .in{flex:1}

/* ---------- buttons / forms ---------- */
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}
.btn{padding:10px 13px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--txt);
  font-weight:650;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;box-shadow:var(--sh)}
.btn:active{transform:translateY(1px)}
.btn.p{background:var(--blu);border-color:var(--blu);color:#fff}
.btn.ok{background:var(--grn);border-color:var(--grn);color:#fff}
.btn.dgr{background:var(--red);border-color:var(--red);color:#fff}
.btn.gh{background:transparent;color:var(--mut);box-shadow:none}
.btn.sm{padding:7px 10px;font-size:12.5px}
.btn.wide{flex:1;justify-content:center}
.btn:disabled{opacity:.45;cursor:not-allowed}
.f{margin-bottom:12px}
.f label{display:block;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--mut);margin-bottom:5px;font-weight:700}
.f label i{color:var(--red);font-style:normal}
.in,select.in,textarea.in{width:100%;padding:11px 12px;background:#fff;border:1px solid var(--line);
  border-radius:10px;color:var(--txt);outline:none;font-size:14px;font-family:var(--ui)}
.in.mono{font-family:var(--mono)}
.in:focus{border-color:var(--blu);box-shadow:0 0 0 3px rgba(36,86,230,.12)}
textarea.in{min-height:74px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:11.5px;color:var(--dim);margin-top:5px}
.err{color:var(--red-tx);font-size:12.5px;margin-top:6px;font-weight:600}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--mut);font-weight:650;cursor:pointer;font-size:13px}
.seg button.on{background:#17233C;border-color:#17233C;color:#fff}
.seg button.on.u{background:var(--red);border-color:var(--red)}
.seg button.on.n{background:var(--gold);border-color:var(--gold)}
.fin-red{color:var(--red-tx)!important;font-weight:800}

/* ---------- model search ---------- */
.mlist{border:1px solid var(--line);border-radius:10px;background:#fff;max-height:230px;overflow:auto;margin-top:6px}
.mlist button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:10px 12px;border:0;
  background:#fff;border-bottom:1px solid var(--line2);font-size:13px;cursor:pointer;color:var(--txt)}
.mlist button:last-child{border-bottom:0}
.mlist button:hover{background:#F3F7FF}
.mlist .pr{font-family:var(--mono);color:var(--dim);flex:0 0 auto}
.mpick{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--blu-bg);
  border:1px solid #C9D9FE;border-radius:10px;padding:10px 12px;font-weight:700;font-size:13.5px}
.calcout{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.calcout>div{background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 11px}
.calcout .k{font-size:9.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--dim);font-weight:700}
.calcout .v{font-family:var(--mono);font-weight:750;font-size:14.5px;margin-top:2px}

/* ---------- table / list rows ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--dim);text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px;border-bottom:1px solid var(--line2)}
.tbl td.n{text-align:right;font-family:var(--mono)}
.sprow{display:flex;align-items:center;gap:10px}

/* ---------- modal sheet ---------- */
.modal{position:fixed;inset:0;z-index:80;background:rgba(16,24,40,.45);display:flex;align-items:flex-end;justify-content:center;padding:0}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 16px 26px;max-height:92vh;overflow:auto}
.sheet h3{margin:0 0 12px;font-size:16px}
.modal img.zoom{max-width:96vw;max-height:80vh;border-radius:10px}

/* ---------- login ---------- */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.lgc{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px 22px;box-shadow:0 12px 40px rgba(20,30,51,.08)}
.lg{font-weight:800;font-size:26px;letter-spacing:-.6px;text-align:center}
.lg em{font-style:normal;color:var(--blu)}
.lsub{text-align:center;color:var(--mut);font-size:12.5px;margin:6px 0 18px}
.dots{display:flex;gap:10px;justify-content:center;margin:16px 0}
.dots i{width:13px;height:13px;border-radius:99px;border:2px solid var(--line);display:block}
.dots i.f{background:var(--blu);border-color:var(--blu)}
.pins{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.pins button{padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--card2);font-size:17px;font-weight:700;cursor:pointer}

/* ---------- bottom bar (sales) ---------- */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:45;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:9px;justify-content:center}
.bar .btn{flex:1;max-width:250px;justify-content:center}
@media(min-width:760px){ .master{grid-template-columns:repeat(6,1fr)!important} }
</style>
</head>

<div id="app"></div>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
/* ==================================================================
   1. CONFIG
   ================================================================== */
const FB_CONFIG = {
  apiKey:            "AIzaSyAYFIvdk8lfof6r59TKecMSDPnFqQWpr4s",
  authDomain:        "denzen-sales.firebaseapp.com",
  databaseURL:       "https://denzen-sales-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:         "denzen-sales",
  storageBucket:     "denzen-sales.firebasestorage.app",
  messagingSenderId: "893728954333",
  appId:             "1:893728954333:web:3f0d07405669dd9ed78834"
};
const ROOT = 'dealDesk5';          // v4 ka apna data — purana dealDesk/ mehfooz
const MODELS_MIRROR = 'prices';    // Sales Tracker (v17) ke rates

/* ==================================================================
   2. DATA LAYER
   ================================================================== */
let LIVE = false, fdb = null;
try{
  if(FB_CONFIG.databaseURL && window.firebase){
    firebase.initializeApp(FB_CONFIG); fdb = firebase.database(); LIVE = true;
  }
}catch(e){ console.warn('Firebase off:', e.message); }

const LOCAL = {}; const subs = [];
function _get(o,path){ return path.split('/').filter(Boolean).reduce((a,k)=> (a==null?null:a[k]), o); }
function _set(o,path,v){ const ks=path.split('/').filter(Boolean); let c=o;
  ks.slice(0,-1).forEach(k=>{ if(typeof c[k]!=='object'||c[k]===null) c[k]={}; c=c[k]; });
  if(v===null) delete c[ks[ks.length-1]]; else c[ks[ks.length-1]]=v; }
function fire(){ subs.forEach(s=> s.cb(_get(LOCAL,s.path))); }
function dbErr(e){ console.error('DB write fail:', e); try{ toast('Save nahi hua — '+((e&&e.message)||e),'bad'); }catch(_){} }
const DB = {
  watch(path, cb){
    if(LIVE) fdb.ref(ROOT+'/'+path).on('value', s=> cb(s.val()));
    else { subs.push({path,cb}); cb(_get(LOCAL,path)); }
  },
  set(path,v){ if(LIVE) return fdb.ref(ROOT+'/'+path).set(v).catch(dbErr); _set(LOCAL,path,v); fire(); return Promise.resolve(); },
  update(path,o){ if(LIVE) return fdb.ref(ROOT+'/'+path).update(o).catch(dbErr);
    Object.keys(o).forEach(k=> _set(LOCAL,path+'/'+k,o[k])); fire(); return Promise.resolve(); },
  push(path,v){ if(LIVE){ const r=fdb.ref(ROOT+'/'+path).push(); r.set(v).catch(dbErr); return r.key; }
    const id='L'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
    _set(LOCAL,path+'/'+id,v); fire(); return id; },
  get(path){ if(!LIVE) return Promise.resolve(_get(LOCAL,path));
    return fdb.ref(ROOT+'/'+path).once('value').then(s=>s.val()); },
  raw(path){ if(!LIVE) return Promise.resolve(null);
    return fdb.ref(path).once('value').then(s=>s.val()); }
};

/* ==================================================================
   3. STATE + HELPERS
   ================================================================== */
const S = { me:null, tab:'dash', leads:{}, cods:{}, reqs:{}, staff:{}, models:{}, cfg:{},
            achat:{}, now:Date.now(), full:null, codFull:null, sp:null, aliOpen:false, open:{}, q:'' };
const $  = s=> document.querySelector(s);
const app= document.getElementById('app');
window.onerror = function(msg,src,line){
  try{ var d=document.createElement('div');
    d.style.cssText='position:fixed;top:0;left:0;right:0;z-index:999;background:#E5484D;color:#fff;padding:10px 14px;font-size:12px;font-family:monospace;white-space:pre-wrap';
    d.textContent='App error (screenshot bhej dein): '+msg+' — line '+line;
    d.onclick=function(){d.remove();}; document.body.appendChild(d);
  }catch(_){}
};
const MIN=60e3, HOUR=3600e3;
const RAM_D = {4:-4500, 8:0, 16:7000, 32:19000};
const SSD_D = {128:-3500, 256:0, 512:7500, 1024:20500};
const PKR = n => (n==null||isNaN(n)) ? '—' : 'Rs '+Number(n).toLocaleString('en-PK');
const K   = n => (n==null||isNaN(n)) ? '—' : (Math.round(Number(n)/100)/10)+'k';
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const digits = s => String(s||'').replace(/\D/g,'');
const pad2 = n => String(n).padStart(2,'0');
const today = ()=>{ const d=new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); };
const dayDiff = d => Math.round((new Date(d+'T00:00:00') - new Date(today()+'T00:00:00'))/864e5);
function ago(ts){ if(!ts) return '';
  const m=Math.floor((S.now-ts)/MIN);
  if(m<1) return 'abhi'; if(m<60) return m+' min'; const h=Math.floor(m/60);
  if(h<24) return h+' ghante'; return Math.floor(h/24)+' din'; }
function stamp(ts){ if(!ts) return ''; const d=new Date(ts);
  return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'})+' '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); }
function dLabel(d){ if(!d) return '—'; const n=dayDiff(d);
  if(n===0) return 'AAJ'; if(n===1) return 'KAL'; if(n<0) return Math.abs(n)+' din guzar gaye';
  return n+' din baad'; }
function toast(msg,kind){
  const t=document.createElement('div'); t.textContent=msg;
  t.style.cssText='position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:99;padding:11px 18px;border-radius:10px;font-weight:650;font-size:14px;max-width:88vw;text-align:center;box-shadow:0 8px 24px rgba(23,32,53,.25);'
    +(kind==='bad'?'background:#E5484D;color:#fff':'background:#12B76A;color:#fff');
  document.body.appendChild(t); setTimeout(()=>t.remove(),2600);
}
function waP(p){ let d=digits(p);
  if(d.startsWith('0')) d='92'+d.slice(1);
  else if(d.length===10 && d[0]==='3') d='92'+d;
  return d; }
const waL = (p,t)=> 'https://wa.me/'+waP(p)+'?text='+encodeURIComponent(t||'');
const okPhone = p => { const d=digits(p); return /^03\d{9}$/.test(d)||/^3\d{9}$/.test(d)||/^923\d{9}$/.test(d); };

  const m=S.models[k]; if(!m) return null;
  const d=(RAM_D[ram]||0)+(SSD_D[ssd]||0);
  const base=Number(m.base)||0;
  return { name:m.name, list:base+d, floor:(Number(m.sellMin)||base)+d };
}

}

/* ==================================================================
   6. BOOT + LOCK (Yousuf -> Bilal 15 min rule)
   ================================================================== */
function safeRender(){
  if(document.querySelector('.modal')) return;
  const ae=document.activeElement;
  if(ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName)) return;
  render();
}
function achatArr(){ return Object.entries(S.achat||{}).map(([id,m])=>({id,...m})).sort((a,b)=>(a.at||0)-(b.at||0)); }
function lockAt(){            // pehla bilal msg jiska yousuf ne jawab nahi diya
  let t=0;
  achatArr().forEach(m=>{ if(m.f==='yousuf') t=0; else if(m.f==='bilal' && !t) t=m.at; });
  return t;
}
const yLocked = ()=> S.me && S.me.id==='yousuf' && lockAt() && (S.now-lockAt() > 15*MIN);
function achatUnread(){
  const meK = S.me.id==='bilal' ? 'bilal' : 'yousuf';
  const a=achatArr();
  let lastMy=0; a.forEach(m=>{ if(m.f===meK) lastMy=Math.max(lastMy,m.at||0); });
  const mark=Math.max(lastMy,(S.achatSeen||{})[meK]||0);
  return a.filter(m=>m.f!==meK && (m.at||0)>mark).length;
}
function boot(){
  if(!LIVE){ _set(LOCAL,'staff',SEED_STAFF); _set(LOCAL,'models',SEED_MODELS); _set(LOCAL,'config',SEED_CFG); }
  DB.watch('leads', v=>{ S.leads=v||{}; safeRender(); });
  DB.watch('cods',  v=>{ S.cods =v||{}; safeRender(); });
  DB.watch('reqs',  v=>{ S.reqs =v||{}; safeRender(); });
  DB.watch('achat', v=>{ S.achat=v||{}; safeRender(); });
  DB.watch('staff', v=>{ if(!v&&LIVE){ DB.set('staff',SEED_STAFF); return; } S.staff=v||{}; safeRender(); });
  DB.watch('models',v=>{ if(!v&&LIVE){ DB.set('models',SEED_MODELS); return; } S.models=v||{}; safeRender(); });
  DB.watch('config',v=>{ if(!v&&LIVE){ DB.set('config',SEED_CFG); return; } S.cfg=v||SEED_CFG; safeRender(); });
  setInterval(()=>{ S.now=Date.now(); if(S.me) safeRender(); }, 20000);
  document.addEventListener('click', ev=>{
    if(!yLocked()) return;
    if(ev.target.closest('#achatBox') || ev.target.closest('.lockbar')) return;
    ev.stopPropagation(); ev.preventDefault();
    toast('Pehle BILAL ko reply karein','bad');
    if(S.tab!=='dash' || S.full || S.codFull){ S.tab='dash'; S.full=null; S.codFull=null; render(); }
    const b=$('#achatBox'); if(b) b.scrollIntoView({behavior:'smooth'});
  }, true);
}

  if(v==='c'){ pinBuf=pinBuf.slice(0,-1); }

    const id=whoSel||($('#who')||{}).value, st=S.staff[id];
    if(st && st.pin===pinBuf){ S.me={id,...st}; S.tab='dash'; pinBuf=''; S.aliOpen=false; render(); return; }

  else if(pinBuf.length<4){ pinBuf+=v; }
  render();

};

   </div>`}
  ${S.full?fsLead():''}

    <div class="${g>0?'bad':'ok'}"><i>Farq</i><b>${g>0?'−':'+'}${K(Math.abs(g))}</b></div>
  </div>`;
}
function ccard(l){
  const adm=isAdm(S.me.role), st=STAT[l.status]||STAT.pending, u=unread(l);
  const who=(S.staff[l.by]||{}).name||l.byName||'—';
  let side2='';
  if(l.status==='booked') side2=`<span class="chip ${dayDiff(l.visitDate)<=1?'c-red':'c-amb'}">${dLabel(l.visitDate)}</span>`;
  else if(l.priority==='urgent'&&isOpenL(l)) side2='<span class="chip c-red">URGENT</span>';

        <div class="nm">${esc(l.name)}</div>

      <div class="end">${side2}<span class="chip ${st.c}">${st.t}</span>${u?`<span class="ub">${u}</span>`:''}</div>
    </div>
    ${trio(l)}

}

function _submit(){
  keepDraft();

  if(!draft.name) miss.push('naam'); if(!draft.phone) miss.push('number');
  if(!draft.budget) miss.push('budget'); if(!draft.model) miss.push('model');
  if(!draft.offer) miss.push('customer offer');
  if(miss.length){ e.textContent='Ye reh gaya: '+miss.join(', ')+'.'; return; }
  if(!okPhone(draft.phone)){ e.textContent='Number theek likhein — 03XXXXXXXXX.'; return; }
  const dup=Object.entries(S.leads).find(([id,x])=> isOpenL(x) && digits(x.phone)===digits(draft.phone));
  if(dup){ e.textContent='Is number ki lead pehle se open hai ('+esc(dup[1].name)+').'; return; }
  const r=calcRate(draft.model,draft.ram,draft.ssd);
  if(!r){ e.textContent='Model select karein.'; return; }
  const offer=Number(draft.offer), now=Date.now();
  const lead={ name:draft.name, phone:draft.phone, budget:+draft.budget||0, usage:draft.usage||'',
    detail:draft.detail||'', modelKey:draft.model, model:r.name, ram:draft.ram||8, ssd:draft.ssd||256,
    list:r.list, floor:r.floor, offer, gap:r.floor-offer,
    priority:draft.priority||'normal', by:S.me.id, byName:S.me.name,
    status:'pending', createdAt:now, sentAt:now, updatedAt:now,
    chat:[{w:S.me.name, sd:'s', t:'Lead bheji — customer '+PKR(offer)+' de raha hai.'+(draft.detail?' '+draft.detail:''), at:now}] };
  DB.push('leads',lead);
  draft={priority:'normal',ram:8,ssd:256};
  toast('Bhej di — jawab isi lead ki chat mein aayega');
  S.tab='dash'; render(); window.scrollTo(0,0);
}

function shrink(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onerror=()=>rej(new Error('File parh nahi saki'));
    r.onload=()=>{ const img=new Image();
      img.onerror=()=>rej(new Error('Image kharab hai'));
      img.onload=()=>{ const mx=1400, sc=Math.min(1,mx/Math.max(img.width,img.height));
        const cv=document.createElement('canvas'); cv.width=img.width*sc; cv.height=img.height*sc;
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
        res({n:file.name, d:cv.toDataURL('image/jpeg',0.72)}); };
      img.src=r.result; };
    r.readAsDataURL(file);
  });
}
window.slipGo=async id=>{
  const f=($('#slipF')||{}).files; if(!f||!f.length){ toast('Photo select karein','bad'); return; }
  try{
    const im=await shrink(f[0]);
    await DB.set('codslip/'+id, im);
    DB.update('cods/'+id,{status:'slipped', slippedAt:Date.now(), updatedAt:Date.now()});
    closeSheet(); toast('Slip bhej di — Complete COD mein chali gayi');

    d.onclick=ev=>{ if(ev.target===d) d.remove(); };
    document.body.appendChild(d);
  });
};

window.importModels=async ()=>{
  const v=await DB.raw(MODELS_MIRROR);
  const out={};
  Object.entries(SEED_MODELS).forEach(([k,m])=>{ out[k]={...m}; });
  Object.entries(S.models).forEach(([k,m])=>{ if(!out[k]) out[k]=m; });
  let upd=0;
  if(v){
    Object.entries(v).forEach(([k,p])=>{
      if(k==='_customModels'||!p||!out[k]) return;
      if(p.avgPrice) out[k].base=+p.avgPrice;
      if(p.leastPrice) out[k].sellMin=+p.leastPrice;
      upd++;
    });
    Object.values(v._customModels||{}).forEach(m=>{
      if(!m||!m.model) return;
      const k=(m.brand+'_'+m.model+'_'+m.processor+'_'+(m.generation||'')).replace(/[^a-zA-Z0-9]/g,'_');
      const p=v[k]||{};
      out[k]={ name:(m.brand+' '+m.model+' '+m.processor+(m.generation?' '+m.generation:'')+(m.gpu?' ('+String(m.gpu).toUpperCase()+')':'')),
        brand:m.brand||'', model:m.model||'', proc:m.processor||'', gen:m.generation||'', gpu:m.gpu||'',
        base:+(p.avgPrice||m.avgPrice)||0, sellMin:+(p.leastPrice||m.leastPrice)||0 };
      upd++;
    });
  }
  DB.set('models',out);
  toast(Object.keys(out).length+' model sync — '+(v?upd+' rate Sales Tracker se aaye':'built-in rates lag gaye'));
};

function viewReport(){
  const all=myLeads();
  if(!all.length) return empty('Report ke liye abhi data nahi');
  const won=all.filter(l=>l.status==='won'), lost=all.filter(l=>l.status==='lost');
  const closed=won.length+lost.length, conv=closed?Math.round(won.length/closed*100):0;
  const ansd=all.filter(l=>l.ansAt&&l.sentAt);
  const avgResp=ansd.length?Math.round(ansd.reduce((s,l)=>s+(l.ansAt-l.sentAt),0)/ansd.length/MIN):null;
  const why={}; lost.forEach(l=>why[l.lostReason||'—']=(why[l.lostReason||'—']||0)+1);
  const per={}; all.forEach(l=>{ const n=(S.staff[l.by]||{}).name||l.byName||'—';
    per[n]=per[n]||{t:0,w:0,l:0}; per[n].t++;
    if(l.status==='won') per[n].w++; if(l.status==='lost') per[n].l++; });
  const codDone=myCods().filter(c=>c.status==='done').length;
  return `<div class="master" style="grid-template-columns:1fr 1fr 1fr">
      <div class="grn"><div class="n">${conv}%</div><div class="l">Band mein se purchase</div></div>
      <div class="amb"><div class="n">${avgResp==null?'—':avgResp+'m'}</div><div class="l">Ausat jawab time</div></div>
      <div class="blu"><div class="n">${codDone}</div><div class="l">COD complete</div></div>
    </div>
    <div class="card"><div class="kvg">
      <div class="kv"><i>Kul leads</i><b class="mono">${all.length}</b></div>
      <div class="kv"><i>Purchase</i><b class="mono" style="color:var(--grn-tx)">${won.length}</b></div>
      <div class="kv"><i>Lost</i><b class="mono" style="color:var(--red-tx)">${lost.length}</b></div>
      <div class="kv"><i>Open</i><b class="mono">${all.filter(isOpenL).length}</b></div>
    </div></div>
    <div class="sec-h"><h3>Salesperson</h3></div>
    <div class="card"><table class="tbl"><thead><tr><th>Naam</th><th style="text-align:right">Leads</th><th style="text-align:right">Purchase</th><th style="text-align:right">Lost</th></tr></thead>
      <tbody>${Object.entries(per).sort((a,b)=>b[1].w-a[1].w).map(([n,v])=>`<tr><td>${esc(n)}</td><td class="n">${v.t}</td><td class="n" style="color:var(--grn-tx)">${v.w}</td><td class="n" style="color:var(--red-tx)">${v.l}</td></tr>`).join('')}</tbody></table></div>
    ${Object.keys(why).length?`<div class="sec-h"><h3>Lost kyun hui</h3></div>

}

/* ---------- v5 constants / helpers ---------- */
const ALI_GATE='7320';           // hard-coded — kahin show/edit nahi hota
const XRAY_GATE='XRAY';          // Ahmed leads+demands ka extra gate
const RAMX=()=> Object.assign({},RAM_D, S.cfg.ramD||{});
const SSDX=()=> Object.assign({},SSD_D, S.cfg.ssdD||{});
function calcRate(k,ram,ssd){
  const m=S.models[k]; if(!m) return null;
  const d=(Number(RAMX()[ram])||0)+(Number(SSDX()[ssd])||0);
  const base=Number(m.base)||0;
  const list=base+d, minS=Number(m.sellMin)||base, floor=minS+d;
  return {name:m.name, list, floor, base, d};
}
S.chatOpen={}; S.q2=''; S.notifs={}; S.mydata={}; S.notes={}; S.gateOk=false; S.xrayOk=false;

const salesIds=()=> Object.keys(S.staff).filter(isSales);
const initials=n=> String(n||'').split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase();
function notify(uid,t){ DB.push('notifs/'+uid,{t,at:Date.now()}); }
function notifyAdmins(t){ Object.keys(S.staff).filter(k=>isAdm(S.staff[k].role)).forEach(k=>notify(k,t)); }
function myNotifs(){ return Object.entries((S.notifs||{})[S.me.id]||{}).map(([id,n])=>({id,...n})).sort((a,b)=>b.at-a.at); }

/* chat visibility — Ahmed (prot) ke COD msgs sirf BILAL ko */
const visMsg=m=> !(m.pv && S.me.role!=='boss');
function unread(l){
  const my=side(S.me.role); const a=arr5(l.chat).filter(visMsg);
  let lastMy=0; a.forEach(m=>{ if(m.sd===my) lastMy=Math.max(lastMy,m.at||0); });
  const mark=isAdm(S.me.role)? Math.max(lastMy, l.seenA||0) : lastMy;
  return a.filter(m=>m.sd!==my && (m.at||0)>mark).length;
}
function tick(ok){ return '<span class="tk '+(ok?'gn':'')+'">\u2713\u2713</span>'; }
function markSeenL(id){ const l=S.leads[id]; if(!l||!S.me) return;
  const my=side(S.me.role), key=my==='s'?'seenS':'seenA';
  let lo=0; arr5(l.chat).filter(visMsg).forEach(m=>{ if(m.sd!==my) lo=Math.max(lo,m.at||0); });
  if(lo && (l[key]||0)<lo) DB.update('leads/'+id,{[key]:Date.now()});
}
function markSeenC(id){ const c=S.cods[id]; if(!c||!S.me) return;
  const my=side(S.me.role), key=my==='s'?'seenS':'seenA';
  let lo=0; arr5(c.chat).filter(visMsg).forEach(m=>{ if(m.sd!==my) lo=Math.max(lo,m.at||0); });
  if(lo && (c[key]||0)<lo) DB.update('cods/'+id,{[key]:Date.now()});
}
function markSeenA(){ if(!S.me||!isAdm(S.me.role)) return;
  const meK=S.me.id==='bilal'?'bilal':'yousuf';
  let lo=0; achatArr().forEach(m=>{ if(m.f!==meK) lo=Math.max(lo,m.at||0); });
  if(lo && ((S.achatSeen||{})[meK]||0)<lo) DB.set('achatSeen/'+meK, Date.now());
}
/* lead status maps (v4 compat): approved/rejected = "jawab aa gaya" */
const isAns = l => l.status==='approved' || l.status==='rejected';
const isOpenL = l => !['won','lost','solved'].includes(l.status) && !l.deny;
const acted = l => (l.salesActAt||0) > (l.ansAt||0);
const needAct = l => isAns(l) && !acted(l);
const isRetouch = l => (isAns(l) && l.ansAt && (S.now-l.ansAt>24*HOUR) && !acted(l))
  || (l.status==='booked' && dayDiff(l.visitDate)<=0);
function postChat(id,text,extra){
  const l=S.leads[id]; if(!l) return;
  const msg={w:S.me.name, sd:side(S.me.role), t:text, at:Date.now()};
  const chat=(l.chat||[]).concat([msg]);
  const ex=Object.assign({}, extra||{});
  if(S.me.role==='sales') ex.salesActAt=Date.now();
  DB.update('leads/'+id, Object.assign({chat, updatedAt:Date.now()}, ex));
}
function postCodChat(id,text,extra){
  const c=S.cods[id]; if(!c) return;
  const msg={w:S.me.name, sd:side(S.me.role), t:text, at:Date.now()};
  if(S.me.role==='sales' && prot(S.me.id)) msg.pv=true;  // sirf Bilal dekhe
  DB.update('cods/'+id, Object.assign({chat:(c.chat||[]).concat([msg]), updatedAt:Date.now()}, extra||{}));
}
/* COD helpers */
const codDue=c=> c.status==='accepted' && c.dueAt ? c.dueAt : 0;
const codExpired=c=> c.status==='accepted' && c.dueAt && S.now>c.dueAt && !c.agreed;
function alarmCods(){ return myCods().filter(codExpired); }
function fmtLeft(ms){ if(ms<=0) return '0m';
  const h=Math.floor(ms/HOUR), m=Math.floor((ms%HOUR)/MIN);
  return (h?h+'h ':'')+m+'m'; }

/* donut SVG */
function donut(segs,total,label){
  const R=44, C=2*Math.PI*R; let off=0;
  const rings=segs.filter(s=>s.v>0).map(s=>{
    const len=total? s.v/total*C : 0;
    const el=`<circle r="${R}" cx="60" cy="60" fill="none" stroke="${s.c}" stroke-width="17"
      stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`;
    off+=len; return el; }).join('');
  return `<svg width="120" height="120" viewBox="0 0 120 120">
    <circle r="${R}" cx="60" cy="60" fill="none" stroke="var(--gry-bg)" stroke-width="17"/>${rings}
    <text x="60" y="57" text-anchor="middle" font-size="22" font-weight="800" font-family="var(--mono)" fill="var(--txt)">${total}</text>
    <text x="60" y="74" text-anchor="middle" font-size="9" fill="var(--dim)" letter-spacing="1">${label}</text></svg>`;
}

/* ---------- boot (v5) ---------- */
function boot(){
  DB.watch('leads', v=>{ S.leads=v||{}; safeRender(); });
  DB.watch('cods',  v=>{ S.cods =v||{}; safeRender(); });
  DB.watch('reqs',  v=>{ S.reqs =v||{}; safeRender(); });
  DB.watch('achat', v=>{ S.achat=v||{}; safeRender(); });
  DB.watch('achatSeen', v=>{ S.achatSeen=v||{}; safeRender(); });
  DB.watch('notifs',v=>{ S.notifs=v||{}; safeRender(); });
  DB.watch('mydata',v=>{ S.mydata=v||{}; safeRender(); });
  DB.watch('notes', v=>{ S.notes=v||{}; safeRender(); });
  DB.watch('staff', v=>{ if(!v&&LIVE){ DB.set('staff',SEED_STAFF); return; } S.staff=v||SEED_STAFF; safeRender(); });
  DB.watch('models',v=>{ if(!v&&LIVE){ DB.set('models',SEED_MODELS); return; } S.models=v||{}; safeRender(); });
  DB.watch('config',v=>{ if(!v&&LIVE){ DB.set('config',SEED_CFG); return; } S.cfg=v||SEED_CFG; safeRender(); });
  setInterval(()=>{ S.now=Date.now(); if(S.me) safeRender(); }, 15000);
}

      ['leads','👥','New Leads',lCntAdm()],

function vCod(){

  if(adm && !S.sp)

    .filter(F2).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  const nw=list.filter(c=>c.status==='sent'||c.status==='ready');
  const pd=list.filter(c=>c.status==='accepted');

  return head
    + grp3(nw,'New COD') + grp3(pd,'Pending — timer chal raha hai')
    + grp3(cold,'Cold — timer khatam, I AGREE ho chuka')
    + grp3(dny,'Not available (deny)')
    + dropGrp('cds','Solved',list.filter(c=>c.status==='solved2'),list.filter(c=>c.status==='solved2').map(codRow).join(''))
    + dropGrp('cdn','Complete COD',dn,dn.map(codRow).join(''))

function grp3(list,title){ list=arr5(list); if(!list.length) return '';
  return `<div class="sec-h"><h3>${title}</h3><span class="ct">${list.length}</span></div>`+list.map(codRow).join(''); }
function codRow(c){
  const chips={ready:['c-blu','Send baqi'],sent:['c-red','New'],accepted:[codExpired(c)?'c-red':'c-amb',codExpired(c)?'DELAY!':'Timer'],
    cold:['c-gry','Cold'],denied:['c-gry','Deny'],done:['c-grn','COMPLETE']};
  const ch=chips[c.status]||['c-gry',c.status];
  const u=(c.chat||[]).filter(visMsg).length && unreadCod(c) ? `<span class="ub">${unreadCod(c)}</span>`:'';
  return `<div class="cc" onclick="openC('${c.id}')">
    <div class="row1"><div style="min-width:0"><div class="nm">${esc(c.name)}</div>
      <div class="sub">${esc(c.model)} · ${esc(c.city)} · ${PKR(c.total)}</div></div>
      <div class="end">${c.status==='accepted'?`<span class="chip ${codExpired(c)?'c-red':'c-amb'}"><span class="tmr2">${codExpired(c)?'DELAY':fmtLeft(c.dueAt-S.now)}</span></span>`:''}
      <span class="chip ${ch[0]}">${ch[1]}</span>${u}</div></div></div>`;
}
function unreadCod(c){
  const my=side(S.me.role); const a=arr5(c.chat).filter(visMsg);
  let lastMy=0; a.forEach(m=>{ if(m.sd===my) lastMy=Math.max(lastMy,m.at||0); });
  const mark=isAdm(S.me.role)? Math.max(lastMy, c.seenA||0) : lastMy;
  return a.filter(m=>m.sd!==my && (m.at||0)>mark).length;
}

  const t=(($('#raT')||{}).value||'').trim();

  closeSheet(); toast('Done — demand complete');
};
window.reqHide=id=>{
  const r=S.reqs[id]; const hide=Object.assign({},r.hide||{}); hide[S.me.id]=true;
  DB.update('reqs/'+id,{hide}); closeSheet(); toast('Aap ke paas se hat gayi');
};
window.reqDel=id=>{ if(!confirm('Dono taraf se delete. Pakka?')) return;
  DB.set('reqs/'+id,null); closeSheet(); toast('Delete ho gayi'); };
window.newReq=()=> sheet(`<h3>Nayi demand</h3>
  <div class="f"><textarea class="in" id="nqT" placeholder="Kya chahiye…"></textarea></div>
  <div class="row"><button class="btn p wide" onclick="newReqGo()">Bhejein</button>
    <button class="btn gh" onclick="closeSheet()">Cancel</button></div>`);
window.newReqGo=()=>{
  const t=(($('#nqT')||{}).value||'').trim(); if(!t){ toast('Likhein to sahi','bad'); return; }
  DB.push('reqs',{text:t, by:S.me.id, byName:S.me.name, status:'open', createdAt:Date.now()});
  notifyAdmins('📋 Nayi demand — '+S.me.name+': '+t.slice(0,50));
  closeSheet(); toast('Bhej di');
};

/* ==================================================================
   RATES (adjustments editable) · TEAM (backup/restore, no ali gate)
   ================================================================== */
function vRatesX(){
  const adm=isAdm(S.me.role);
  const adj = adm? `<div class="sec-h"><h3>RAM / Storage adjustments</h3></div>
  <div class="card"><div class="g2">
    <div>${[4,8,16,32].map(k=>`<div class="f"><label>RAM ${k}GB (+/− Rs)</label><input class="in mono" id="adR${k}" value="${RAMX()[k]}"></div>`).join('')}</div>
    <div>${[128,256,512,1024].map(k=>`<div class="f"><label>Storage ${k}GB (+/− Rs)</label><input class="in mono" id="adS${k}" value="${SSDX()[k]}"></div>`).join('')}</div>
  </div><div class="row"><button class="btn p" onclick="adjSave()">Save adjustments</button></div></div>`:'';
  return adj + viewRates();
}
window.adjSave=()=>{
  const ramD={}, ssdD={};
  [4,8,16,32].forEach(k=> ramD[k]=Number(($('#adR'+k)||{}).value)||0);
  [128,256,512,1024].forEach(k=> ssdD[k]=Number(($('#adS'+k)||{}).value)||0);
  DB.update('config',{ramD,ssdD}); toast('Adjustments save — rates update ho gaye');
};
function vTeamX(){
  if(S.me.role!=='boss') return empty('Ye section sirf BILAL ke liye hai');
  return `<div class="ctop"><div><h2>Team & Settings</h2></div></div>
  <div class="sec-h"><h3>Team</h3><span class="ct">${Object.keys(S.staff).length}</span></div>
  <div class="card"><table class="tbl"><thead><tr><th>Naam</th><th>Role</th><th>PIN</th><th></th></tr></thead>
    <tbody>${Object.entries(S.staff).map(([k,s])=>`<tr><td>${esc(s.name)}</td>
      <td>${isAdm(s.role)?'Admin':'Salesperson'}${s.prot?' · private':''}</td><td class="mono">${esc(s.pin)}</td>
      <td><button class="btn sm gh" onclick="editStaff('${k}')">Edit</button></td></tr>`).join('')}</tbody></table>
    <div class="row"><button class="btn p" onclick="editStaff(null)">+ Naya salesperson</button></div></div>
  <div class="sec-h"><h3>Backup & Restore</h3></div>
  <div class="card">
    <div class="hint" style="margin-bottom:10px">Backup = pura data (leads, COD, demands, staff, rates, notes) ek file mein. Restore usi file se sab wapis — maujooda data replace ho jata hai.</div>
    <div class="row"><button class="btn p" onclick="bkDl()">⬇ Backup download</button>
      <label class="btn" style="cursor:pointer">⬆ Restore<input type="file" accept="application/json" style="display:none" onchange="bkRs(this)"></label></div>
  </div>
  <div class="sec-h"><h3>Phone numbers</h3></div>
  <div class="card"><div class="g2">
      <div class="f"><label>YOUSUF ka phone</label><input class="in mono" id="sYp" value="${esc(S.cfg.yousufPhone||'')}"></div>
      <div class="f"><label>BILAL ka phone</label><input class="in mono" id="sBp" value="${esc(S.cfg.bilalPhone||'')}"></div></div>
    <div class="row"><button class="btn p" onclick="saveCfg()">Save</button></div></div>`;
}
window.bkDl=async ()=>{
  try{
    const data=await DB.read(''); const j=JSON.stringify(data||{},null,1);
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([j],{type:'application/json'}));
    a.download='dealdesk-backup-'+today()+'.json'; a.click();
    toast('Backup download ho gaya');
  }catch(e){ toast('Backup fail — '+e.message,'bad'); }
};
window.bkRs=inp=>{
  const f=inp.files&&inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{
      const o=JSON.parse(r.result);
      if(!confirm('Restore se maujooda data REPLACE ho jayega. Pakka?')) return;
      if(LIVE) fdb.ref(ROOT).set(o).then(()=>toast('Restore ho gaya')).catch(e=>toast('Fail: '+e.message,'bad'));
      else toast('Internet/Firebase ke bina restore nahi ho sakta','bad');
    }catch(e){ toast('File theek nahi hai','bad'); } };
  r.readAsText(f); inp.value='';
};

/* ==================================================================
   MY DATA + NOTES (personal — sirf salesperson ka apna)
   ================================================================== */
let md={}, mdMore=false;
function myMd(){ return Object.entries((S.mydata||{})[S.me.id]||{}).map(([id,x])=>({id,...x})).sort((a,b)=>b.at-a.at); }
function myNotes(){ return Object.entries((S.notes||{})[S.me.id]||{}).map(([id,x])=>({id,...x})).sort((a,b)=>b.at-a.at); }
function vMyData(){
  const rows=myMd().filter(F2).map(x=>`<div class="cc" onclick="mdView('${x.id}')">
    <div class="row1"><div style="min-width:0"><div class="nm">${esc(x.name)}</div>
      <div class="sub">${esc(x.phone)}${x.model?' · '+esc(x.model):''}</div></div>
      <div class="end"><span class="chip c-gry">${stamp(x.at).split(' ')[0]||''}</span></div></div></div>`).join('');
  const notes=myNotes().map(n=>`<div class="ntc ${n.st==='done'?'done':n.st==='urgent'?'urg':''}">
    <div class="nt">${esc(n.t)}</div>
    <div class="nm2">${stamp(n.at)}
      <button class="btn sm ${n.st==='done'?'ok':'gh'}" onclick="noteSt('${n.id}','${n.st==='done'?'':'done'}')">✓ Complete</button>
      <button class="btn sm ${n.st==='urgent'?'dgr':'gh'}" onclick="noteSt('${n.id}','${n.st==='urgent'?'':'urgent'}')">! Urgent</button>
      <button class="btn sm gh" onclick="noteEd('${n.id}')">✏</button>
      <button class="btn sm gh" onclick="noteDel('${n.id}')">🗑</button></div></div>`).join('');
  return `<div class="ctop"><div><h2>My Data</h2><div class="csub">Sirf aap ka personal record — kisi aur se connected nahi</div></div>${srchBox()}</div>
  <div class="card">
    <div class="g2"><div class="f"><label>Name <i>*</i></label><input class="in" id="mN" value="${esc(md.name||'')}"></div>
      <div class="f"><label>Number <i>*</i></label><input class="in mono" id="mP" inputmode="tel" value="${esc(md.phone||'')}"></div></div>
    <div class="f"><label>Details <i>*</i></label><textarea class="in" id="mD">${esc(md.detail||'')}</textarea></div>
    <div class="drop-h" onclick="mdMoreT()" style="margin:4px 0"><h3>Aur details (optional)</h3><span class="ch">${mdMore?'▾':'▸'}</span></div>
    ${mdMore?`<div class="g2"><div class="f"><label>Model</label><input class="in" id="mM" value="${esc(md.model||'')}"></div>
      <div class="f"><label>RAM</label><input class="in" id="mR" value="${esc(md.ram||'')}"></div></div>
    <div class="g2"><div class="f"><label>Storage</label><input class="in" id="mS" value="${esc(md.sto||'')}"></div>
      <div class="f"><label>Generation / Processor</label><input class="in" id="mG" value="${esc(md.gen||'')}"></div></div>`:''}
    <div id="mdE" class="err"></div>
    <div class="row"><button class="btn p wide" onclick="mdSave()">Submit</button></div>
  </div>
  <div class="sec-h"><h3>Customers</h3><span class="ct">${myMd().length}</span></div>
  ${rows||empty('Abhi koi customer save nahi')}
  <div class="sec-h"><h3>📝 Notes</h3><span class="ct">${myNotes().length}</span></div>
  <div class="card"><div class="f"><textarea class="in" id="ntT" placeholder="Jo likhna hai…"></textarea></div>
    <div class="row"><button class="btn p" onclick="noteAdd()">Submit</button></div></div>
  ${notes}`;
}
window.mdMoreT=()=>{ mdKeep(); mdMore=!mdMore; render(); };
function mdKeep(){ [['mN','name'],['mP','phone'],['mD','detail'],['mM','model'],['mR','ram'],['mS','sto'],['mG','gen']]
  .forEach(([i,k])=>{ const el=$('#'+i); if(el) md[k]=el.value; }); }
window.mdSave=()=>{
  mdKeep();
  if(!md.name||!md.phone||!md.detail){ const e=$('#mdE'); if(e) e.textContent='Name, number aur details zaroori hain.'; else toast('Name, number aur details zaroori hain','bad'); return; }
  const rec={name:md.name, phone:md.phone, detail:md.detail, model:md.model||'', ram:md.ram||'', sto:md.sto||'', gen:md.gen||''};
  if(md.editId){ DB.update('mydata/'+S.me.id+'/'+md.editId, rec); }
  else DB.push('mydata/'+S.me.id, Object.assign({at:Date.now()},rec));
  md={}; mdMore=false; render(); toast('Save ho gaya');
};
window.mdView=id=>{
  const x=((S.mydata||{})[S.me.id]||{})[id]; if(!x) return;
  sheet(`<h3>${esc(x.name)}</h3>
    <div class="kv"><i>Number</i><b class="mono">${esc(x.phone)}</b></div>
    ${x.model?`<div class="kv"><i>Model</i><b>${esc(x.model)}</b></div>`:''}
    ${x.ram?`<div class="kv"><i>RAM</i><b>${esc(x.ram)}</b></div>`:''}
    ${x.sto?`<div class="kv"><i>Storage</i><b>${esc(x.sto)}</b></div>`:''}
    ${x.gen?`<div class="kv"><i>Gen/Proc</i><b>${esc(x.gen)}</b></div>`:''}
    <div class="hint" style="margin-top:8px;white-space:pre-wrap">${esc(x.detail)}</div>
    <div class="row" style="margin-top:12px"><button class="btn" onclick="mdEdit('${id}')">✏ Edit</button>
      <button class="btn dgr" onclick="mdDel('${id}')">🗑 Delete</button>
      <button class="btn gh" onclick="closeSheet()">Band</button></div>`);
};
window.mdEdit=id=>{
  const x=((S.mydata||{})[S.me.id]||{})[id]; if(!x) return;
  md=Object.assign({editId:id},x); mdMore=!!(x.model||x.ram||x.sto||x.gen);
  closeSheet(); render(); window.scrollTo(0,0); toast('Form mein aa gaya — edit kar ke Submit');
};
window.mdDel=id=>{ if(!confirm('Customer delete? Pakka?')) return;
  DB.set('mydata/'+S.me.id+'/'+id,null); closeSheet(); toast('Delete ho gaya'); };
window.noteAdd=()=>{
  const t=(($('#ntT')||{}).value||'').trim(); if(!t){ toast('Kuch likhein','bad'); return; }
  DB.push('notes/'+S.me.id,{t, st:'', at:Date.now()}); render(); toast('Note save');
};
window.noteSt=(id,st)=>{ DB.update('notes/'+S.me.id+'/'+id,{st}); };
window.noteDel=id=>{ if(!confirm('Note delete?')) return; DB.set('notes/'+S.me.id+'/'+id,null); };
window.noteEd=id=>{
  const n=((S.notes||{})[S.me.id]||{})[id]; if(!n) return;
  sheet(`<h3>Note edit</h3><div class="f"><textarea class="in" id="neT">${esc(n.t)}</textarea></div>
    <div class="row"><button class="btn p wide" onclick="noteEdGo('${id}')">Save</button>
      <button class="btn gh" onclick="closeSheet()">Cancel</button></div>`);
};
window.noteEdGo=id=>{
  const t=(($('#neT')||{}).value||'').trim(); if(!t) return;
  DB.update('notes/'+S.me.id+'/'+id,{t}); closeSheet(); toast('Save');
};

/* ==================================================================
   NOTIFICATIONS
   ================================================================== */
function vNotifs(){
  const list=myNotifs();
  setTimeout(()=>{ list.filter(n=>!n.read).forEach(n=> DB.update('notifs/'+S.me.id+'/'+n.id,{read:true})); },600);
  return `<div class="ctop"><div><h2>Notifications</h2></div>
    ${list.length?`<div class="row" style="margin-left:auto"><button class="btn gh sm" onclick="ntClr()">Sab clear</button></div>`:''}</div>`
    + (list.map(n=>`<div class="cc" style="cursor:default"><div class="row1">
        <div style="min-width:0"><div class="nm" style="font-weight:600;font-size:13.5px">${esc(n.t)}</div>
        <div class="sub">${stamp(n.at)}</div></div>
        <span class="end">${!n.read?'<span class="chip c-red">NEW</span>':''}
        <button class="btn sm gh" onclick="ntDel('${n.id}')">✕</button></span></div></div>`).join('')
      || empty('Koi notification nahi'));
}
window.ntClr=()=>{ DB.set('notifs/'+S.me.id,null); render(); };

window.delSheetS=id=> sheet(`<h3>Lead delete</h3>
  <div class="hint" style="margin-bottom:10px">"Sirf mere paas se" — admin ke paas rahegi. "Dono taraf se" — admin ke paas se bhi delete, admin ko notification jayegi.</div>
  <div class="row"><button class="btn wide" onclick="delMineGo('${id}')">Sirf mere paas se</button>
    <button class="btn dgr wide" onclick="delBothGo('${id}')">Dono taraf se</button></div>
  <div class="row"><button class="btn gh wide" onclick="closeSheet()">Cancel</button></div>`);
window.delMineGo=id=>{ const l=S.leads[id]; if(!l) return;
  const hf=Object.assign({},l.hf||{}); hf[S.me.id]=true;
  DB.update('leads/'+id,{hf,updatedAt:Date.now()}); closeSheet(); S.full=null; render(); toast('Aap ke paas se hat gayi'); };
window.delBothGo=id=>{ const l=S.leads[id]; if(!l) return;
  if(!confirm('Dono taraf se delete. Pakka?')) return;
  notifyAdmins('🗑 '+S.me.name+' ne "'+(l.name||'')+'" lead aap ke paas se delete ki');
  DB.set('leads/'+id,null); closeSheet(); S.full=null; render(); toast('Delete ho gayi'); };
window.delLead=(id,perm)=>{ const l=S.leads[id]; if(!l) return;
  if(!confirm('Permanent delete — dono taraf se. Pakka?')) return;
  if(S.me.role!=='sales' && l.by) notify(l.by,'🗑 '+S.me.name+' ne "'+(l.name||'')+'" lead delete ki');
  DB.set('leads/'+id,null); closeSheet(); S.full=null; render(); toast('Delete ho gayi'); };
window.delSheetSC=id=> sheet(`<h3>COD delete</h3>
  <div class="hint" style="margin-bottom:10px">"Sirf mere paas se" — admin ke paas rahegi. "Dono taraf se" — admin ke paas se bhi delete, admin ko notification jayegi.</div>
  <div class="row"><button class="btn wide" onclick="codMineGo('${id}')">Sirf mere paas se</button>
    <button class="btn dgr wide" onclick="codBothGo('${id}')">Dono taraf se</button></div>
  <div class="row"><button class="btn gh wide" onclick="closeSheet()">Cancel</button></div>`);
window.codMineGo=id=>{ const c=S.cods[id]; if(!c) return;
  const hf=Object.assign({},c.hf||{}); hf[S.me.id]=true;
  DB.update('cods/'+id,{hf,updatedAt:Date.now()}); closeSheet(); S.codFull=null; render(); toast('Aap ke paas se hat gayi'); };
window.codBothGo=id=>{ const c=S.cods[id]; if(!c) return;
  if(!confirm('Dono taraf se delete. Pakka?')) return;
  notifyAdmins('🗑 '+S.me.name+' ne "'+(c.name||'')+'" COD aap ke paas se delete ki');
  DB.set('cods/'+id,null); closeSheet(); S.codFull=null; render(); toast('Delete ho gayi'); };
window.ntDel=id=>{ DB.set('notifs/'+S.me.id+'/'+id,null); };
/* GO */
boot();
render();
</script>
