<style>
:root{
  color-scheme:light;
  --ink:#0A0A0C;--ink2:#15161B;--ink3:#23252D;--ink4:#3A3D48;
  --bg:#F2F3F6;--card:#FFFFFF;--line:#E4E7ED;--line2:#EEF0F4;
  --tx:#0D0F13;--tx2:#474D5A;--tx3:#8A90A0;
  --or:#F07A1A;--or2:#F6A01E;--or3:#F8C823;--or-d:#D5600B;--or-bg:#FFF0E2;
  --red:#E2332E;--red-d:#B81F1B;--red-bg:#FFE8E7;
  --grn:#0E9F58;--grn-bg:#E2F7EB;
  --amb:#D98A06;--amb-bg:#FFF3D4;
  --blu:#2A66F5;--blu-bg:#E6EEFF;
  --wa:#19A956;
  --r:16px;--r2:12px;
  --sh:0 1px 2px rgba(13,15,19,.04),0 10px 24px -14px rgba(13,15,19,.14);
  --grad:linear-gradient(135deg,#EC6A17 0%,#F39A1C 60%,#F8C823 130%);
  --ff:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--ff);font-weight:700;font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p{margin:0}
button{font-family:inherit}
svg{display:block}
.num,.tn{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid rgba(240,122,26,.55);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
.side{position:fixed;inset:0 auto 0 0;width:238px;background:var(--ink);color:#fff;display:flex;flex-direction:column;padding:18px 14px 14px;z-index:30;overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;padding:4px 6px 18px}
.brand .logo{width:44px;height:44px;flex:none}
.brand b{display:block;font-size:16px;font-weight:800;letter-spacing:.02em;line-height:1.1}
.brand span{display:block;font-size:10.5px;font-weight:800;letter-spacing:.16em;color:var(--or2);margin-top:3px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav .tab{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:#C6CAD6;background:transparent;border:0;cursor:pointer;font-weight:800;font-size:14px;text-align:left;position:relative;width:100%}
.nav .tab svg{width:20px;height:20px;flex:none;stroke:currentColor}
.nav .tab:hover{background:var(--ink2);color:#fff}
.nav .tab.on{background:var(--grad);color:#fff;box-shadow:0 8px 18px -8px rgba(240,122,26,.7)}
.nav .tab .bd{margin-left:auto;min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:var(--red);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center}
.nav .tab.on .bd{background:#fff;color:var(--red-d)}
.nav .sep{height:1px;background:var(--ink3);margin:8px 6px}
.who{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 8px 2px;border-top:1px solid var(--ink3)}
.av{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;flex:none;background:var(--ink3)}
.who .nm{font-size:13.5px;font-weight:800;line-height:1.15}
.who .rl{font-size:11px;color:#9AA0AF;font-weight:700}
.who .pw{margin-left:auto;width:38px;height:38px;border-radius:12px;border:0;background:var(--ink2);color:#fff;cursor:pointer;display:grid;place-items:center}
.who .pw:hover{background:var(--red)}
.who .pw svg{width:18px;height:18px;stroke:currentColor}

.main{margin-left:238px;min-height:100vh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);min-height:68px;display:flex;align-items:center;gap:12px;padding:10px 28px}
.top h1{font-size:21px;font-weight:800;letter-spacing:-.015em}
.top .st{font-size:12.5px;color:var(--tx3);font-weight:700;margin-top:1px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;font-size:12.5px;font-weight:800;background:var(--bg);color:var(--tx2);white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--tx3)}
.pill.live{background:var(--grn-bg);color:#087443}.pill.live .dot{background:var(--grn);box-shadow:0 0 0 0 rgba(14,159,88,.6);animation:pulse 1.8s infinite}
.pill.off{background:var(--red-bg);color:var(--red-d)}.pill.off .dot{background:var(--red)}
.pill.demo{background:var(--amb-bg);color:#8A5A00}.pill.demo .dot{background:var(--amb)}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(14,159,88,0)}100%{box-shadow:0 0 0 0 rgba(14,159,88,0)}}
.page{padding:24px 28px 70px;max-width:1460px;width:100%;margin:0 auto}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;font-weight:800;color:var(--tx2);cursor:pointer;padding:6px 8px 6px 0;font-size:13.5px}
.back svg{width:18px;height:18px;stroke:currentColor}

/* ---------- cards / stats ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.card h3{font-size:16px;font-weight:800;letter-spacing:-.01em}
.card .hint{font-size:12.5px;color:var(--tx3);font-weight:700;margin-top:2px}
.card.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.card.dark .hint{color:#9AA0AF}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 14px;position:relative;box-shadow:var(--sh);min-height:104px;text-align:left;font:inherit;color:inherit;display:block;width:100%}
button.stat{cursor:pointer}
button.stat:hover{border-color:#CFD4DE}
.stat .lb{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);padding-right:46px;line-height:1.3}
.stat .num{font-size:33px;font-weight:800;letter-spacing:-.03em;margin-top:6px;line-height:1.05}
.stat .sub{font-size:12.5px;color:var(--tx2);font-weight:700;margin-top:4px}
.stat .ic{position:absolute;top:13px;right:13px;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--or-bg);color:var(--or-d)}
.stat .ic svg{width:20px;height:20px;stroke:currentColor}
.ic.g{background:var(--grn-bg);color:var(--grn)}.ic.r{background:var(--red-bg);color:var(--red)}.ic.b{background:var(--blu-bg);color:var(--blu)}.ic.a{background:var(--amb-bg);color:var(--amb)}.ic.k{background:#ECEEF3;color:var(--ink)}
.stat.alert{border-color:#F3B4B1;background:linear-gradient(180deg,#fff 40%,#FFF3F2)}
.stat.alert .num{color:var(--red)}
.stat.good .num{color:var(--grn)}

.grid2>*,.grid3>*,.two>*,.sps>*,.stats>*,.cards>*{min-width:0}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:16px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.mt{margin-top:16px}.mt2{margin-top:24px}.mb{margin-bottom:14px}
.grow{flex:1}
.muted{color:var(--tx3)}.red{color:var(--red)}.grn{color:var(--grn)}.ora{color:var(--or-d)}

/* hero (dark 20%) */
.hero{background:var(--ink);color:#fff;border-radius:20px;padding:20px 24px;display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"ring text btn" "ring hx btn";column-gap:24px;row-gap:0;align-items:center;position:relative;overflow:hidden}
.hero>.ring{grid-area:ring}.hero>.htx{grid-area:text;align-self:end}.hero>.hx{grid-area:hx;align-self:start}.hero>.btn{grid-area:btn}
.hero:after{content:"";position:absolute;right:-70px;top:-90px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(240,122,26,.35),transparent 65%);pointer-events:none}
.hero h2{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.hero p{color:#B3B8C6;font-size:13.5px;font-weight:700;margin-top:6px;max-width:46ch}
.hero .hx{display:flex;gap:22px;margin-top:14px;flex-wrap:wrap}
.hero .hx div b{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em}
.hero .hx div span{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#9AA0AF;font-weight:800}
.ring{position:relative;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .c b{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1}
.ring .c span{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:#9AA0AF;margin-top:3px}
.ring.lt .c span{color:var(--tx3)}

/* queue */
.qh{display:flex;align-items:center;gap:10px;margin:28px 0 12px}
.qh h3{font-size:17.5px;font-weight:800;letter-spacing:-.01em}
.qh .dt{width:11px;height:11px;border-radius:50%}
.qh .cnt{padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:800;background:#E6E8EE;color:var(--tx)}
.qh .cnt.r{background:var(--red);color:#fff}.qh .cnt.b{background:var(--blu);color:#fff}.qh .cnt.o{background:var(--or);color:#fff}.qh .cnt.g{background:var(--grn);color:#fff}
.qh .more{margin-left:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.lc{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 12px 18px;box-shadow:var(--sh);cursor:pointer;position:relative;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.lc:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:#D5D9E2}
.lc:hover{border-color:#CBD0DB}
.lc.over{border-color:#F1AFAC;background:linear-gradient(180deg,#fff 55%,#FFF5F4)}.lc.over:before{background:var(--red)}
.lc.wada:before{background:var(--blu)}.lc.follow:before{background:var(--or)}.lc.done:before{background:var(--grn)}
.lc.done{opacity:.86}
.lc-top{display:flex;align-items:flex-start;gap:8px;justify-content:space-between}
.lc-name{font-size:17px;font-weight:800;letter-spacing:-.015em;line-height:1.2}
.lc-sub{font-size:13px;color:var(--tx2);font-weight:700}
.lc-sub b{color:var(--tx);font-weight:800}
.lc-note{font-size:13px;color:var(--tx2);background:var(--bg);border-radius:10px;padding:8px 10px;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lc-note i{font-style:normal;color:var(--tx3);font-weight:700}
.lc-acts{display:flex;gap:8px;margin-top:2px}
.lc-acts .btn{flex:1;padding:9px 8px}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.lc-top .chips{justify-content:flex-end;flex:none;max-width:55%}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:4px 9px;border-radius:999px;background:#ECEEF3;color:var(--tx2);white-space:nowrap}
.chip.hot{background:#FFE4D6;color:#C2410C}.chip.warm{background:var(--amb-bg);color:#8A5A00}
.chip.wd{background:var(--blu-bg);color:#1C4FD0}.chip.bad{background:var(--red);color:#fff}
.chip.ok{background:var(--grn-bg);color:#087443}.chip.k{background:var(--ink);color:#fff}.chip.or{background:var(--or-bg);color:var(--or-d)}
.empty{background:#fff;border:1.5px dashed #D5D9E2;border-radius:var(--r);padding:26px 18px;text-align:center;color:var(--tx2);font-weight:700}
.empty b{display:block;font-size:16px;color:var(--tx);font-weight:800;margin-bottom:4px}

/* buttons */
.btn{appearance:none;border:0;border-radius:12px;padding:11px 15px;font-weight:800;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:transform .08s,filter .15s,background .15s;white-space:nowrap;text-decoration:none;color:var(--tx);background:#fff}
.btn svg{width:17px;height:17px;stroke:currentColor;flex:none}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.or{background:var(--grad);color:#fff;box-shadow:0 8px 16px -10px rgba(240,122,26,.9)}.btn.or:hover{filter:brightness(1.05)}
.btn.dark{background:var(--ink);color:#fff}.btn.dark:hover{background:var(--ink3)}
.btn.ghost{background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--tx)}.btn.ghost:hover{box-shadow:inset 0 0 0 1.5px #C5CAD6}
.btn.soft{background:var(--bg);color:var(--tx)}.btn.soft:hover{background:#E7E9EF}
.btn.wa{background:var(--wa);color:#fff}.btn.wa:hover{filter:brightness(1.06)}
.btn.red{background:var(--red);color:#fff}.btn.redl{background:var(--red-bg);color:var(--red-d)}
.btn.grn{background:var(--grn);color:#fff}
.btn.sm{padding:7px 11px;font-size:12.5px;border-radius:10px}.btn.lg{padding:14px 20px;font-size:15px;border-radius:14px}
.btn.blk{width:100%}

/* forms */
.form{display:grid;gap:14px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>label{font-size:12px;font-weight:800;color:var(--tx2);letter-spacing:.01em}
.fld>label em{font-style:normal;color:var(--red)}
.fld .help{font-size:12px;color:var(--tx3);font-weight:700}
input,select,textarea{font-family:inherit;font-weight:700;font-size:14.5px;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;color:var(--tx);outline:none;width:100%;min-width:0}
textarea{resize:vertical;min-height:74px;line-height:1.45}
input:focus,select:focus,textarea:focus{border-color:var(--or);box-shadow:0 0 0 4px rgba(240,122,26,.14)}
input::placeholder,textarea::placeholder{color:#A5ABB9;font-weight:600}
.seg{display:flex;background:#E9EBF0;border-radius:13px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:10px;padding:10px 8px;font-weight:800;font-size:13.5px;color:var(--tx2);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:#fff;color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.seg button.on.hot{background:#F0530F;color:#fff}.seg button.on.warm{background:#E99A0C;color:#fff}
.qchips{display:flex;gap:6px;flex-wrap:wrap}
.qchips button{border:0;background:#E9EBF0;border-radius:999px;padding:7px 12px;font-weight:800;font-size:12.5px;cursor:pointer;color:var(--tx2)}
.qchips button.on{background:var(--ink);color:#fff}
.note-box{border-radius:12px;padding:11px 13px;font-size:13px;font-weight:700;background:var(--blu-bg);color:#1C3F9E}
.note-box.o{background:var(--or-bg);color:#8A3D00}.note-box.r{background:var(--red-bg);color:var(--red-d)}.note-box.g{background:var(--grn-bg);color:#075C36}
.note-box b{font-weight:800}
.search{position:relative;flex:1;min-width:220px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--tx3)}
.search input{padding-left:40px;border-radius:13px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:0;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);border-radius:999px;padding:8px 13px;font-weight:800;font-size:12.5px;cursor:pointer;color:var(--tx2);display:inline-flex;gap:6px;align-items:center}
.filters button.on{background:var(--ink);color:#fff;box-shadow:none}
.filters button i{font-style:normal;opacity:.7}

/* outcome buttons */
.outs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.outs button{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:12px 6px;font-weight:800;font-size:12.5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:7px;color:var(--tx2);line-height:1.2;text-align:center}
.outs button .oi{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--bg)}
.outs button svg{width:19px;height:19px;stroke:currentColor}
.outs button.on{border-color:var(--ink);background:var(--ink);color:#fff}
.outs button.on .oi{background:var(--ink3)}
.outs button.on.won{background:var(--grn);border-color:var(--grn)}.outs button.on.won .oi{background:rgba(255,255,255,.2)}
.outs button.on.lost{background:var(--red);border-color:var(--red)}.outs button.on.lost .oi{background:rgba(255,255,255,.2)}
.outs button.on.wada{background:var(--blu);border-color:var(--blu)}.outs button.on.wada .oi{background:rgba(255,255,255,.2)}

/* table */
.tblw{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.tbl{width:100%;border-collapse:separate;border-spacing:0;min-width:760px}
.tbl th{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--tx3);text-align:left;padding:13px 14px;border-bottom:1px solid var(--line);background:#FAFBFC;white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line2);font-size:13.5px;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}.tbl tbody tr:hover td{background:#FAFBFC}
.tbl .nm{font-weight:800;font-size:14.5px}.tbl .ph{font-size:12.5px;color:var(--tx3);font-weight:700}
.tbl td.r,.tbl th.r{text-align:right}
.tbl input[type=checkbox]{width:18px;height:18px;accent-color:var(--or)}
.selbar{position:sticky;bottom:14px;margin-top:14px;background:var(--ink);color:#fff;border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:0 18px 40px -16px rgba(0,0,0,.5);z-index:10}
.selbar b{font-size:14.5px}

/* charts */
.vb{display:flex;align-items:flex-end;justify-content:center;gap:clamp(10px,2.4vw,22px);height:196px;padding:0 6%}
.vb .col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;width:36px;height:100%}
.vb .stack{width:100%;display:flex;flex-direction:column-reverse;border-radius:10px 10px 5px 5px;overflow:hidden;min-height:4px;background:#E9EBF0}
.vb .seg1{background:var(--grad)}.vb .seg2{background:var(--ink)}
.vb .v{font-size:12.5px;font-weight:800}
.vb .l{font-size:11px;font-weight:800;color:var(--tx3);letter-spacing:.04em;text-transform:uppercase}
.vb .col.hi .l{color:var(--or-d)}
.vb.dense{gap:5px;padding:0;justify-content:stretch}.vb.dense .col{width:auto;flex:1;min-width:0}.vb.dense .v{font-size:10px}.vb.dense .l{font-size:9.5px;letter-spacing:0}.vb.dense .stack{border-radius:6px 6px 3px 3px}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;font-weight:800;color:var(--tx2)}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.donut{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut .lgd{display:grid;gap:8px;flex:1;min-width:150px}
.donut .lgd div{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800}
.donut .lgd i{width:11px;height:11px;border-radius:4px;flex:none}
.donut .lgd span{margin-left:auto;color:var(--tx2);font-variant-numeric:tabular-nums}

/* salesperson cards (admin) */
.sps{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}
.sp{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh);padding:16px;display:flex;flex-direction:column;gap:14px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.sp:hover{border-color:#CBD0DB}
.sp-h{display:flex;align-items:center;gap:12px}
.sp-h .av{width:44px;height:44px;font-size:17px;border-radius:14px}
.sp-h b{font-size:17px;font-weight:800;letter-spacing:-.01em;display:block;line-height:1.15}
.sp-h .grow span{font-size:12px;color:var(--tx3);font-weight:700;display:block}
.sp-b{display:flex;align-items:center;gap:16px}
.sp-n{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1}
.sp-n div{background:var(--bg);border-radius:12px;padding:9px 10px}
.sp-n div b{display:block;font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.sp-n div span{font-size:9.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--tx3)}
.sp-n div.r{background:var(--red-bg)}.sp-n div.r b{color:var(--red)}
.sp-n div.g{background:var(--grn-bg)}.sp-n div.g b{color:var(--grn)}

/* list rows */
.list{display:grid;gap:8px}
.li{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.li:hover{border-color:#CBD0DB}
.li .t{font-weight:800;font-size:14.5px;line-height:1.25}.li .s{font-size:12.5px;color:var(--tx2);font-weight:700}
.li .rt{margin-left:auto;text-align:right;flex:none}
.li.unseen{border-color:#F6C9A0;background:#FFFAF5}
.li .udot{width:9px;height:9px;border-radius:50%;background:var(--or);flex:none}

/* sheets */
#sheets>.ov{position:fixed;inset:0;background:rgba(10,10,12,.55);backdrop-filter:blur(3px);z-index:100;display:flex;justify-content:flex-end;animation:fade .18s}
.sheet{background:var(--bg);width:min(580px,100%);height:100%;display:flex;flex-direction:column;animation:slide .24s cubic-bezier(.2,.8,.2,1);box-shadow:-30px 0 60px -30px rgba(0,0,0,.5)}
.sheet.wide{width:min(760px,100%)}
.sh-h{background:#fff;border-bottom:1px solid var(--line);padding:16px 18px;display:flex;align-items:center;gap:12px;flex:none}
.sh-h h2{font-size:18px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.sh-h .s{font-size:12.5px;color:var(--tx3);font-weight:700}
.sh-x{margin-left:auto;width:38px;height:38px;border-radius:12px;border:0;background:var(--bg);cursor:pointer;display:grid;place-items:center;flex:none}
.sh-x svg{width:18px;height:18px;stroke:var(--tx)}
.sh-b{padding:18px;overflow-y:auto;flex:1;display:grid;gap:14px;align-content:start}
.sh-f{background:#fff;border-top:1px solid var(--line);padding:12px 18px;display:flex;gap:10px;flex:none}
.sh-f .btn{flex:1}
#sheets>.ov.center{justify-content:center;align-items:center;padding:16px}
.modal{background:#fff;border-radius:20px;width:min(440px,100%);padding:22px;animation:pop .2s;display:grid;gap:14px;max-height:92vh;overflow:auto}
.modal h2{font-size:19px;font-weight:800;letter-spacing:-.01em}
.modal p{color:var(--tx2);font-weight:700}
.modal .row .btn{flex:1}
@keyframes fade{from{opacity:0}}@keyframes slide{from{transform:translateX(40px);opacity:0}}@keyframes pop{from{transform:scale(.95);opacity:0}}

/* profile */
.pf-head{background:var(--ink);color:#fff;border-radius:18px;padding:18px;display:grid;gap:10px}
.pf-head h2{font-size:23px;font-weight:800;letter-spacing:-.02em}
.pf-head .ph{justify-self:start;display:inline-flex;align-items:center;gap:4px;font-size:15px;font-weight:800;color:var(--or2);background:transparent;border:0;padding:0;cursor:pointer;font-family:inherit}
.pf-next{border-radius:16px;padding:14px 16px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;gap:12px}
.pf-next.over{background:var(--red-bg);border-color:#F3B4B1}
.pf-next .big{font-size:18px;font-weight:800;letter-spacing:-.01em}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.kv div span{display:block;font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--tx3)}
.kv div b{font-size:14.5px;font-weight:800;word-break:break-word}
.tl{display:grid;gap:0;position:relative}
.tl .ti{display:grid;grid-template-columns:34px 1fr;gap:10px;padding-bottom:14px;position:relative}
.tl .ti:before{content:"";position:absolute;left:16px;top:34px;bottom:0;width:2px;background:var(--line)}
.tl .ti:last-child:before{display:none}
.tl .td{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:#fff;border:1px solid var(--line);color:var(--tx2)}
.tl .td svg{width:16px;height:16px;stroke:currentColor}
.tl .td.g{background:var(--grn-bg);color:var(--grn);border-color:transparent}.tl .td.r{background:var(--red-bg);color:var(--red);border-color:transparent}.tl .td.b{background:var(--blu-bg);color:var(--blu);border-color:transparent}.tl .td.o{background:var(--or-bg);color:var(--or-d);border-color:transparent}
.tl .tt{font-weight:800;font-size:14px}.tl .tm{font-size:12px;color:var(--tx3);font-weight:700}
.tl .tn{font-size:13.5px;color:var(--tx2);font-weight:700;margin-top:3px;white-space:pre-wrap;word-break:break-word}

/* chat */
.chat{display:flex;flex-direction:column;gap:8px}
.msg{max-width:84%;padding:9px 12px;border-radius:14px;font-size:14px;font-weight:700;background:#fff;border:1px solid var(--line);align-self:flex-start;white-space:pre-wrap;word-break:break-word}
.msg.me{align-self:flex-end;background:var(--ink);color:#fff;border-color:var(--ink)}
.msg small{display:block;font-size:10.5px;font-weight:800;opacity:.6;margin-top:3px}

/* toast */
#toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:300;display:grid;gap:8px;width:min(440px,92vw)}
.toast{background:var(--ink);color:#fff;border-radius:14px;padding:13px 16px;font-weight:800;font-size:14px;box-shadow:0 18px 40px -14px rgba(0,0,0,.6);display:flex;align-items:center;gap:10px;animation:pop .2s}
.toast.ok{background:#0B7A44}.toast.err{background:var(--red-d)}
.toast svg{width:18px;height:18px;stroke:currentColor;flex:none}

/* login */
.login{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr}
.lg-l{background:var(--ink);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.lg-l:after{content:"";position:absolute;left:-140px;bottom:-180px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(240,122,26,.38),transparent 62%)}
.lg-l .brand{padding:0;position:relative;z-index:1}.lg-l .brand .logo{width:58px;height:58px}.lg-l .brand b{font-size:20px}
.lg-l h1{font-size:clamp(30px,3.6vw,48px);font-weight:800;letter-spacing:-.035em;line-height:1.08;position:relative;z-index:1;max-width:13ch}
.lg-l p{color:#B3B8C6;font-size:15.5px;font-weight:700;margin-top:16px;max-width:42ch;position:relative;z-index:1}
.lg-l .ft{font-size:12px;color:#7C8293;font-weight:700;position:relative;z-index:1}
.lg-r{display:grid;place-items:center;padding:32px}
.lg-box{width:min(420px,100%);display:grid;gap:18px}
.lg-box h2{font-size:24px;font-weight:800;letter-spacing:-.02em}
.lg-box .sub{color:var(--tx2);font-weight:700;margin-top:-10px}
.people{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.person{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:14px;display:flex;align-items:center;gap:11px;cursor:pointer;font-weight:800;font-size:15px;text-align:left;color:var(--tx)}
.person:hover{border-color:var(--or)}
.person small{display:block;font-size:11px;color:var(--tx3);font-weight:700}
.pin-dots{display:flex;gap:12px;justify-content:center;margin:6px 0}
.pin-dots i{width:16px;height:16px;border-radius:50%;background:#DADDE5;transition:background .12s,transform .12s}
.pin-dots i.f{background:var(--or);transform:scale(1.12)}
.pin-dots.bad{animation:shake .35s}.pin-dots.bad i{background:var(--red)}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{height:62px;border-radius:16px;border:1.5px solid var(--line);background:#fff;font-size:23px;font-weight:800;cursor:pointer;color:var(--tx)}
.pad button:hover{border-color:#C5CAD6}.pad button:active{background:var(--ink);color:#fff}
.pad button.x{background:var(--bg);font-size:14px}
.pad button svg{width:22px;height:22px;stroke:currentColor;margin:0 auto}
.demo-tip{background:var(--amb-bg);color:#7A4E00;border-radius:12px;padding:10px 12px;font-size:13px;font-weight:700}
.load{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid #E1E4EA;border-top-color:var(--or);animation:rot .8s linear infinite;margin:0 auto 14px}
@keyframes rot{to{transform:rotate(360deg)}}

/* settings */
.sect{display:grid;gap:14px}
.sect+.sect{margin-top:18px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.sw{width:54px;height:30px;border-radius:999px;border:0;background:#CDD1DB;position:relative;cursor:pointer;flex:none;transition:background .15s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .16s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw.on{background:var(--or)}.sw.on:after{transform:translateX(24px)}
.card.dark .sw{background:var(--ink4)}.card.dark .sw.on{background:var(--or)}

/* ---------- mobile ---------- */
@media (max-width:1100px){.grid3{grid-template-columns:1fr 1fr}.grid3>:first-child{grid-column:1/-1}}
@media (max-width:900px){
  .side{position:static;width:auto;padding:12px 12px 10px;overflow:visible}
  .brand{padding:2px 4px 12px}.brand .logo{width:38px;height:38px}
  .nav{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
  .nav .tab{flex-direction:column;gap:5px;padding:10px 4px 8px;font-size:10.5px;text-align:center;background:var(--ink2);border-radius:13px;line-height:1.15}
  .nav .tab .lb{display:block}
  .nav .tab .bd{position:absolute;top:5px;right:6px;margin:0;min-width:19px;height:19px;font-size:11px;padding:0 5px}
  .nav .sep{display:none}
  .who{margin:0;border:0;padding:0;position:absolute;top:12px;right:12px}
  .who .nm,.who .rl{display:none}.who .av{width:36px;height:36px}.who .pw{width:36px;height:36px;margin-left:0}
  .side{position:relative}
  .main{margin-left:0}
  .top{position:static;padding:12px 14px;min-height:0;flex-wrap:wrap}
  .top h1{font-size:19px}
  .page{padding:14px 14px 80px}
  .stats{grid-template-columns:1fr 1fr;gap:10px}
  .stat{padding:13px 12px 12px;min-height:92px}.stat .num{font-size:27px}.stat .ic{width:34px;height:34px;top:11px;right:11px}.stat .lb{padding-right:38px}
  .grid2,.grid3,.two{grid-template-columns:1fr}
  .hero{grid-template-columns:auto 1fr;grid-template-areas:"ring text" "hx hx";column-gap:14px;padding:16px}
  .hero>.btn{display:none}.hero h2{font-size:17.5px}.hero p{font-size:12.5px;margin-top:4px}
  .hero>.htx{align-self:center}
  .hero .hx{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
  .hero .hx div b{font-size:21px}.hero .hx div span{font-size:8.5px;letter-spacing:.05em;display:block;line-height:1.25}
  .ring .c span{font-size:8.5px}
  .cards{grid-template-columns:1fr}
  .sheet,.sheet.wide{width:100%}
  .login{grid-template-columns:1fr}.lg-l{padding:26px 22px;gap:22px}.lg-l h1{font-size:30px}.lg-l .ft{display:none}.lg-r{padding:22px 16px 40px}
  .outs{grid-template-columns:repeat(5,1fr);gap:6px}.outs button{font-size:10.5px;padding:10px 2px}.outs button .oi{width:34px;height:34px}
  .f2{grid-template-columns:1fr}
  .btn{white-space:normal}
  .row>input,.row>select{flex:1 1 140px;width:auto!important}
  .selbar{bottom:8px}
  .kv{grid-template-columns:1fr 1fr}
  .vb{padding:0;gap:9px}.vb .col{width:30px}
}

</style>
</head>

class LocalDB {
  constructor() { this.kind = 'demo'; this.mem = LS.get('lc_db_v1') || {}; this.ls = []; this._t = null; }
  _node(path, make) {
    const parts = path ? path.split('/').filter(Boolean) : []; let n = this.mem;
    for (let i = 0; i < parts.length - 1; i++) { if (n[parts[i]] == null || typeof n[parts[i]] !== 'object') { if (!make) return [null, null]; n[parts[i]] = {}; } n = n[parts[i]]; }
    return [n, parts[parts.length - 1]];
  }
  _get(path) { if (!path) return this.mem; const [n, k] = this._node(path, false); return n ? n[k] : undefined; }
  _res(v, cur) {
    if (v && typeof v === 'object') { if ('.inc' in v) return (Number(cur) || 0) + v['.inc']; const o = Array.isArray(v) ? [] : {}; for (const k in v) { const r = this._res(v[k], cur && cur[k]); if (r != null) o[k] = r; } return o; }
    return v;
  }
  _set(path, val) {
    if (!path) { this.mem = val || {}; return; }
    const [n, k] = this._node(path, true);
    if (val == null) delete n[k]; else n[k] = this._res(val, n[k]);
  }
  _emit() {
    clearTimeout(this._t); this._t = setTimeout(() => LS.set('lc_db_v1', this.mem), 250);
    for (const l of this.ls) { const v = this._get(l.path); const j = JSON.stringify(v ?? null); if (j !== l.last) { l.last = j; l.cb(clone(v ?? null)); } }
  }
  get(path) { return Promise.resolve(clone(this._get(path) ?? null)); }
  set(path, val) { this._set(path, clone(val)); this._emit(); return Promise.resolve(); }
  update(map) { for (const p in map) this._set(p, clone(map[p])); this._emit(); return Promise.resolve(); }
  push() { return pushId(); }
  inc(n) { return { '.inc': n }; }
  on(path, cb) { const l = { path, cb, last: null }; this.ls.push(l); const v = this._get(path); l.last = JSON.stringify(v ?? null); setTimeout(() => cb(clone(v ?? null)), 0); return () => { this.ls = this.ls.filter(x => x !== l); }; }
  tx(path, fn) { const nv = fn(clone(this._get(path) ?? null)); if (nv === undefined) return Promise.resolve(false); this._set(path, nv); this._emit(); return Promise.resolve(true); }
  range(path, a, b) { const o = this._get(path) || {}, r = {}; for (const k of Object.keys(o).sort()) if (k >= a && k <= b) r[k] = clone(o[k]); return Promise.resolve(r); }
  onConn(cb) { cb(true); }
}

class FireDB {
  constructor(cfg) { this.kind = 'live'; this.app = firebase.apps.length ? firebase.app() : firebase.initializeApp(cfg); this.db = firebase.database(); this.root = this.db.ref(ROOT); }
  ref(p) { return p ? this.root.child(p) : this.root; }
  get(p) { return this.ref(p).once('value').then(s => s.val()); }
  set(p, v) { return this.ref(p).set(clone(v)); }
  update(map) { return this.root.update(clone(map)); }
  push(p) { return this.ref(p || 'x').push().key; }
  inc(n) { return firebase.database.ServerValue.increment(n); }
  on(p, cb) { const r = this.ref(p); const h = r.on('value', s => cb(s.val()), e => console.warn('listen', p, e)); return () => r.off('value', h); }
  tx(p, fn) { return this.ref(p).transaction(cur => fn(cur)).then(r => !!r.committed).catch(() => false); }
  range(p, a, b) { return this.ref(p).orderByKey().startAt(a).endAt(b).once('value').then(s => s.val() || {}); }
  onConn(cb) { this.db.ref('.info/connected').on('value', s => cb(!!s.val())); }
}

/* ---------------- schedule engine ---------------- */
function wadaNext(t, wd) { // pre-touch (1 din pehle) -> day-of -> miss check
  const k = diffDays(wd, t);
  if (k >= 2) return { nx: addDays(wd, -1), nt: 'wadaPre' };
  if (k === 1) return { nx: wd, nt: 'wadaDay' };
  if (k === 0) return { nx: addDays(wd, 1), nt: 'wadaMiss' };
  return null;
}
const wadaAlive = (l, t = today()) => !!(l.wd && l.wd >= t);
function cadPlan(l, temp, restart) {
  const cad = CFG().cad[temp] || [1];
  if (restart || temp !== l.temp) return { nx: addDays(today(), Math.max(1, cad[0] || 1)), step: 0, n: cad.length };
  const i = (l.step || 0) + 1;
  if (i >= cad.length) return { nx: null, step: i, n: cad.length };
  return { nx: addDays(today(), Math.max(1, cad[i] - cad[i - 1])), step: i, n: cad.length };
}
function secOf(l, t = today()) {
  if (l.wd === t) return 'wada';
  if (l.nx < t) return 'over';
  if (l.nx === t) return l.wd ? 'wada' : 'follow';
  if (l.lt && l.lt.res !== 'new' && dstr(new Date(l.lt.ts)) === t) return 'done';
  return 'later';
}
const isDue = (l, t = today()) => l.nx <= t;
const overDays = (l, t = today()) => l.nx < t ? diffDays(t, l.nx) : 0;
function tplKeyFor(l) {
  const t = today();
  if (l.st) return 'retarget';
  if (l.wd) return l.wd > t ? 'wadaPre' : (l.wd === t ? 'wadaDay' : 'wadaMiss');
  if ((l.na || 0) >= 2) return 'noans';
  return (l.tc || 0) <= 1 ? 'first' : 'follow';
}
function fillTpl(x, l) {
  const c = CFG();
  const first = String(l.nm || '').trim().split(/\s+/)[0] || '';
  return String(x || '').replace(/\{name\}/g, first).replace(/\{model\}/g, l.model || 'laptop').replace(/\{me\}/g, S.me ? S.me.n : '')
    .replace(/\{shop\}/g, c.shop).replace(/\{addr\}/g, c.addr).replace(/\{rate\}/g, l.rate ? money(l.rate) : '').replace(/\{date\}/g, l.wd ? fmtD(l.wd) : '');
}

function statInc(up, emp, key, n = 1) { const p = 'stats/' + today() + '/' + emp + '/' + key; let m = _INC.get(up); if (!m) { m = {}; _INC.set(up, m); } m[p] = (m[p] || 0) + n; up[p] = DB.inc(m[p]); }
function touchRec(up, id, rec) { up['touches/' + id + '/' + DB.push('touches/' + id)] = Object.assign({ ts: Date.now(), by: S.me.id }, rec); }

async function createLead(f) {
  const t = today(), now = Date.now(), ph = normPhone(f.ph), up = {};
  const ex = await DB.get('phones/' + ph);
  if (ex) { const e = new Error('dup'); e.dup = ex; throw e; }
  const id = DB.push('active/' + f.o), note = (f.note || '').trim();
  const l = { id, nm: f.nm.trim(), ph, temp: f.temp, o: f.o, c: now, cBy: S.me.id, step: 0, tc: 1, na: 0, note, lt: { ts: now, res: 'new', note } };
  for (const k of ['city', 'model', 'spec', 'src']) if ((f[k] || '').trim()) l[k] = f[k].trim();
  if (f.ph2 && normPhone(f.ph2)) l.ph2 = normPhone(f.ph2);
  if (+f.bud) l.bud = +f.bud; if (+f.rate) l.rate = +f.rate;
  if (f.mode === 'wada') { const w = wadaNext(t, f.wd); l.wd = f.wd; l.wf = f.wf || 'buy'; if (+f.wa) l.wa = +f.wa; l.nx = w.nx; l.nt = w.nt; statInc(up, f.o, 'w'); }
  else if (f.mode === 'date') { l.nx = f.nx; l.nt = 'follow'; }

  up['active/' + f.o + '/' + id] = l;
  up['phones/' + ph] = { id, o: f.o, st: 'a' };
  touchRec(up, id, { res: 'new', ch: 'wa', note, nx: l.nx, wd: l.wd || null });
  statInc(up, f.o, 'n');
  if (f.o !== S.me.id) addNote(up, f.o, 'Naya customer aap ko diya gaya: ' + l.nm, id, 'assign');

/* d: {res:'talk'|'na'|'wada'|'won'|'lost', ch, note, nx, toPool, temp, wd, wf, wa, amt, sold, reason} */
async function logTouch(l, d) {
  const t = today(), now = Date.now(), up = {}, n = clone(l);
  statInc(up, l.o, l.nx < t ? 'lt' : (l.nx === t ? 'ot' : 'ex'));
  n.tc = (l.tc || 0) + 1; n.lt = { ts: now, res: d.res, note: (d.note || '').trim() };
  n.na = d.res === 'na' ? (l.na || 0) + 1 : 0;
  const rec = { res: d.res, ch: d.ch || 'wa', note: (d.note || '').trim(), due: l.nx };
  let close = null;
  if (d.res === 'wada') {
    const w = wadaNext(t, d.wd); n.wd = d.wd; n.wf = d.wf || 'buy'; n.wa = +d.wa || null; n.nx = w.nx; n.nt = w.nt;
    if (d.temp) n.temp = d.temp; statInc(up, l.o, 'w'); rec.wd = d.wd;
  } else if (d.res === 'talk' || d.res === 'na') {
    const alive = wadaAlive(l, t);
    if (alive) { const w = wadaNext(t, l.wd); n.nx = w.nx; n.nt = w.nt; if (d.temp) n.temp = d.temp; }
    else {
      const broken = !!l.wd; if (broken) { n.wd = null; n.wf = null; n.wa = null; statInc(up, l.o, 'wb'); }
      const temp = d.temp || l.temp, plan = cadPlan(l, temp, broken);
      n.temp = temp; n.step = plan.step;
      if (d.toPool) close = 'cold'; else { n.nx = d.nx || plan.nx || addDays(t, 1); n.nt = 'follow'; }
    }
  } else if (d.res === 'won') { close = 'won'; n.amt = +d.amt || 0; n.sold = (d.sold || l.model || '').trim(); rec.amt = n.amt; }
  else if (d.res === 'lost') { close = 'lost'; n.reason = d.reason || 'Other'; rec.reason = n.reason; }
  if (close === 'cold') rec.pool = true;
  if (close) closeInto(up, l, n, close); else { rec.nx = n.nx; up['active/' + l.o + '/' + l.id] = n; }
  touchRec(up, l.id, rec);
  await DB.update(up); return n;
}
function closeInto(up, l, n, st) {
  const t = today(), mon = monthOf(t);
  n.st = st; n.cAt = Date.now(); n.cBy = S.me.id; n.nx = null; n.nt = null; n.hp = null;
  up['active/' + l.o + '/' + l.id] = null;
  up['closed/' + mon + '/' + l.id] = n;
  up['phones/' + l.ph] = { id: l.id, o: l.o, st, m: mon };
  if (l.hp) up['help/' + l.id] = null;
  if (st === 'won') { statInc(up, l.o, 'won'); if (n.amt) statInc(up, l.o, 'amt', n.amt); if (l.wd) statInc(up, l.o, 'wk'); }
  else if (st === 'lost') { statInc(up, l.o, 'lost'); up['stats/' + t + '/' + l.o + '/lr/' + keySafe(n.reason)] = DB.inc(1); }
  else statInc(up, l.o, 'cold');
  S.closed[l.id] = clone(n);
}
async function reschedule(l, nx, why) {
  const up = {}, n = clone(l); n.nx = nx; n.nt = 'follow'; n.rs = (l.rs || 0) + 1; n.rsAt = Date.now();
  up['active/' + l.o + '/' + l.id] = n; statInc(up, l.o, 'rs');

function transferUp(up, l, to, why, auto) {
  const t = today(), n = clone(l); n.o = to; n.from = l.o; n.tr = (l.tr || 0) + 1; n.tAt = Date.now(); if (n.nx < t) n.nx = t;

  statInc(up, l.o, 'to'); statInc(up, to, 'ti');

async function transferMany(leads, to, why) {

/* auto transfer sweep (admin devices) */
async function autoSweep() {
  const c = CFG(); if (!isAdmin() || !c.auto.on) return 0;
  const t = today(), dev = S.dev;
  const ok = await DB.tx('locks/sweep', cur => (cur && cur.by !== dev && Date.now() - cur.ts < 240000) ? undefined : { ts: Date.now(), by: dev });
  if (!ok) return 0;
  const sales = salesStaff(); if (sales.length < 2) return 0;
  const hot = {}; sales.forEach(s => hot[s.id] = 0); allLeads().forEach(l => { if (l.temp === 'hot' && hot[l.o] != null) hot[l.o]++; });
  const up = {}; let c2 = 0;
  for (const l of allLeads()) {
    if (l.temp !== 'hot' || l.nx >= t || diffDays(t, l.nx) < c.auto.days) continue;
    const tg = sales.filter(s => s.id !== l.o).sort((a, b) => hot[a.id] - hot[b.id])[0]; if (!tg) continue;
    transferUp(up, l, tg.id, c.auto.days + ' din se touch nahi hua', true); hot[tg.id]++; if (hot[l.o] != null) hot[l.o]--; c2++;
    if (c2 >= 60) break;
  }
  if (c2) await DB.update(up); return c2;
}

function sumStats(days, emp, src) { // days: array of date strings
  const o = { n: 0, ot: 0, lt: 0, ex: 0, w: 0, wk: 0, wb: 0, won: 0, amt: 0, lost: 0, cold: 0, rs: 0, ti: 0, to: 0, re: 0, lr: {} };
  for (const d of days) { const day = (src || S.stm)[d] || {}; for (const e in day) { if (emp && e !== emp) continue; const s = day[e]; for (const k in s) { if (k === 'lr') { for (const r in s.lr) o.lr[r] = (o.lr[r] || 0) + s.lr[r]; } else if (k in o) o[k] += Number(s[k]) || 0; } } }
  o.done = o.ot + o.lt; return o;
}
const lastDays = n => { const t = today(), a = []; for (let i = n - 1; i >= 0; i--) a.push(addDays(t, -i)); return a; };
const monthDays = () => { const t = today(), a = []; let d = monthOf(t) + '-01'; while (d <= t) { a.push(d); d = addDays(d, 1); } return a; };
async function loadClosed(mon) {
  if (S.closedLoaded[mon]) return; const v = await DB.get('closed/' + mon) || {};
  for (const id in v) S.closed[id] = v[id]; S.closedLoaded[mon] = true;
}

};
ACT.stCad = async () => { const h = parseDays($('#stHot').value), w = parseDays($('#stWarm').value); if (!h.length || !w.length) return toast('Dono schedule mein kam az kam ek din likhein', 'err'); await DB.set('cfg/cad', { hot: h, warm: w }); toast('Schedule save ho gaya', 'ok'); };
ACT.stAuto = async () => { const n = Math.max(1, Math.min(30, parseInt($('#stDays').value, 10) || 2)); await DB.set('cfg/auto', { on: CFG().auto.on, days: n }); toast('Save ho gaya', 'ok'); };
ACT.stShopSave = async () => { await DB.update({ 'cfg/shop': $('#stShop').value.trim() || DEF_CFG.shop, 'cfg/addr': $('#stAddr').value.trim() || DEF_CFG.addr }); toast('Save ho gaya', 'ok'); };
ACT.stLists = async () => { const r = lines($('#stRs').value), h = lines($('#stHr').value), s = lines($('#stSr').value); if (!r.length || !h.length || !s.length) return toast('Koi list khali nahi ho sakti', 'err'); await DB.update({ 'cfg/reasons': r, 'cfg/helpRs': h, 'cfg/sources': s }); toast('Lists save ho gayin', 'ok'); };
ACT.tplEdit = d => { const c = CFG(), k = d.k, tp = k ? c.tpl[k] : { t: '', x: '' }, core = k && DEF_CFG.tpl[k]; openSheet(sheetHtml(k ? 'Message edit karein' : 'Naya message', '{name} {model} {me} {shop} {addr} {rate} {date}', '<div class="form"><div class="fld"><label>Naam</label><input id="tpT" ' + vAttr(tp.t) + '></div><div class="fld"><label>Message</label><textarea id="tpX" style="min-height:220px">' + esc(tp.x) + '</textarea></div>' + (core ? '<div class="note-box">Ye message system khud chunta hai (' + esc(DEF_CFG.tpl[k].t) + '), is liye delete nahi hota. <button class="btn sm soft" data-act="tplReset" data-k="' + esc(k) + '" style="margin-left:6px">Asal wapas layein</button></div>' : '') + '</div>', (k && !core ? '<button class="btn redl" data-act="tplDel" data-k="' + esc(k) + '" style="flex:0 0 auto">' + ic('trash') + '</button>' : '') + '<button class="btn soft" data-act="close">Wapas</button><button class="btn or" data-act="tplSave" data-k="' + esc(k) + '">Save karein</button>')); };
ACT.tplSave = async d => { const t = $('#tpT').value.trim(), x = $('#tpX').value.trim(); if (!t || x.length < 5) return toast('Naam aur message dono likhein', 'err'); const tpl = clone(CFG().tpl), k = d.k || ('c' + Date.now().toString(36)); tpl[k] = { t, x }; await DB.set('cfg/tpl', tpl); closeSheet(); toast('Message save ho gaya', 'ok'); };

ACT.bkUp = () => $('#bkFile').click();
INP.bkFile = async (v, el) => { const f = el.files && el.files[0]; if (!f) return; try { const j = JSON.parse(await f.text()); if (!j || j.app !== ROOT || !j.data || !j.data.staff) throw new Error('bad'); const w = await ask('Backup restore karein?', 'Maujooda <b>poora data mit kar</b> backup (' + fmtTs(j.at) + ') wala data aa jayega. Tasdeeq ke liye RESTORE likhein.', { input: 'RESTORE', danger: true, yes: 'Restore karein' }); if (w !== 'RESTORE') return toast('Restore nahi hua', 'err'); await DB.set('', j.data); toast('Restore ho gaya, dobara login karein', 'ok'); setTimeout(() => location.reload(), 1200); } catch (e) { toast('Ye sahi backup file nahi', 'err'); } el.value = ''; };
ACT.bkCsv = () => { const L = allLeads(); downloadCsv('denzen-active-customers-' + today() + '.csv', [['Name', 'Phone', 'Model', 'Budget', 'Rate', 'Temp', 'Salesperson', 'Agla kaam', 'Wada', 'Aakhri note', 'Bana']].concat(L.map(l => [l.nm, l.ph, l.model || '', l.bud || '', l.rate || '', l.temp, staffName(l.o), l.nx, l.wd || '', (l.lt && l.lt.note) || l.note || '', dstr(new Date(l.c))]))); toast(L.length + ' customers ki CSV ban gayi', 'ok'); };
ACT.fbSave = () => { const txt = $('#stFb').value, cfg = {}; txt.replace(/(apiKey|authDomain|databaseURL|projectId|storageBucket|messagingSenderId|appId)["']?\s*:\s*["']([^"']+)["']/g, (m, k, v) => { cfg[k] = v; }); if (!cfg.apiKey || !cfg.databaseURL) return toast('Config mein apiKey aur databaseURL zaroori hain', 'err'); LS.set('lc_fb', cfg); LS.del('lc_session'); toast('Cloud set ho gaya, app dobara khul rahi hai', 'ok'); setTimeout(() => location.reload(), 900); };
ACT.fbOff = async () => { if (!await ask('Cloud hata dein?', 'Ye device dobara Demo mode mein chala jayega. Cloud ka data mehfooz rahega.', { danger: true, yes: 'Hata dein' })) return; LS.del('lc_fb'); LS.del('lc_session'); location.reload(); };
ACT.demoRe = async () => { if (!await ask('Demo data dobara banayein?', 'Is device ka maujooda data mit jayega.', { danger: true, yes: 'Haan' })) return; await DB.set('', null); await seedDemo(); LS.del('lc_session'); location.reload(); };
ACT.demoWipe = async () => { if (!await ask('Sab mita kar khali shuru karein?', 'Farzi customers aur farzi team mit jayegi. Aap ka admin login rahega.', { danger: true, yes: 'Mita dein' })) return; const me = S.staff[S.me.id]; await DB.set('', { staff: { [S.me.id]: me }, cfg: S.cfg || {} }); toast('Sab saaf. Ab Team page se salesperson add karein', 'ok'); go('team'); };

/* =====================================================================
   DEMO DATA (sirf Demo mode mein, cloud par kabhi nahi)

  let sd = 20260920; const R = () => { sd |= 0; sd = sd + 0x6D2B79F5 | 0; let x = Math.imul(sd ^ sd >>> 15, 1 | sd); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; };
  const pick = a => a[Math.floor(R() * a.length)], ri = (a, b) => a + Math.floor(R() * (b - a + 1)), t = today(), now = Date.now(), DAY = 864e5;
  const D = { cfg: {}, staff: {}, active: {}, closed: {}, phones: {}, touches: {}, stats: {}, help: {}, notes: { admin: {} } };

  const srcs = DEF_CFG.sources; let ni = 0, pi = 3001000;
